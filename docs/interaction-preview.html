。日历由手机系统管理，任务修改、暂停或删除后，请自行检查已有日历事项。\u003c/view>\u003cview class=\"privacy-copy\">剪贴板：只有你点击「复制文案」时，才会把该文案写入剪贴板，方便你到对应平台粘贴。\u003c/view>\u003c/view>\n  \u003cview class=\"privacy-section\">\u003ctext class=\"section-title\">如何管理和删除\u003c/text>\u003cview class=\"privacy-copy\">你可以编辑或删除任务，撤销完成确认，也可以在「设置」中清空{{cloud ? '我的云端数据' : '本机数据'}}。清空操作无法恢复，不会同时删除手机日历中已经添加的提醒。\u003c/view>\u003c/view>\n  \u003cview class=\"privacy-section\">\u003ctext class=\"section-title\">平台操作与提醒边界\u003c/text>\u003cview class=\"privacy-copy\">本小程序提供清单、完成确认和经授权的提醒入口。抖音互动、续火花及微博打卡需要你自行在对应平台完成；这里的「已完成」仅代表你的手动确认。\u003c/view>\u003c/view>\n  \u003cview class=\"privacy-section\">\u003ctext class=\"section-title\">离线缓存与共同任务\u003c/text>\u003cview class=\"privacy-copy\">云模式还会在本机保存当前已验证用户的任务缓存和待同步操作。每次重新打开需要先联网验证当前身份，再使用离线缓存；出现同步冲突时保留本机草稿，不会静默覆盖云端数据。\u003c/view>\u003cview class=\"privacy-copy\">共同任务由你主动发起或同意加入，参与双方可看到共同任务名称、平台及本工具中的当日确认状态。不会向对方开放私人任务、备注、文案或聊天内容。邀请24小时过期，重新生成会使旧邀请失效。你可以退出，发起人可以关闭共同任务。\u003c/view>\u003c/view>\n\u003c/view>\n","pages/privacy/index.wxss":"@import \"../shared.wxss\";\n.privacy-section { margin-top: 39rpx; }\n.privacy-copy { font-size: 25rpx; color: #7f8a79; line-height: 1.95; margin-top: 17rpx; text-align: justify; }\n.privacy-screen .page-title { font-size: 45rpx; }\n","pages/records/index.js":"const { todayKey, shiftDate, formatDateLabel, platformLabel } = require('../../utils/domain');\nconst { syncMessage, savedToast } = require('../../utils/sync-ui');\n\nPage({\n  data: { date: '', today: '', dateLabel: '', records: [], loading: true, loadError: false, busyId: '', syncMessage: '' },\n  onLoad() { const today = todayKey(); this.setData({ date: today, today }); },\n  onShow() { this.setData({ today: todayKey() }); this.refresh(); },\n  onPullDownRefresh() { this.refresh().finally(() => wx.stopPullDownRefresh()); },\n  async refresh() {\n    const requestId = this._refreshId = (this._refreshId || 0) + 1;\n    const date = this.data.date || todayKey();\n    this.setData({ loading: true, loadError: false, date, dateLabel: formatDateLabel(date) });\n    try {\n      const records = await getApp().store.listRecords({ date });\n      if (requestId !== this._refreshId) return;\n      this.setData({ records: records.map(item => ({ ...item, platformLabel: platformLabel(item.type), avatar: Array.from(item.name || '续')[0], timeLabel: this.timeLabel(item.completedAt) })), syncMessage: syncMessage(getApp().store) });\n    } catch (error) { if (requestId === this._refreshId) { this.setData({ loadError: true }); wx.showToast({ title: '记录未能加载', icon: 'none' }); } }\n    finally { if (requestId === this._refreshId) this.setData({ loading: false }); }\n  },\n  timeLabel(value) { const millis = new Date(value).getTime(); return Number.isNaN(millis) ? '' : `${new Date(millis + 8 * 60 * 60 * 1000).toISOString().slice(11, 16)} 确认`; },\n  onDate(event) { this.setData({ date: event.detail.value }); this.refresh(); },\n  onPrevious() { if (this.data.loading || this.data.busyId) return; this.setData({ date: shiftDate(this.data.date, -1) }); this.refresh(); },\n  onNext() { if (this.data.loading || this.data.busyId || this.data.date >= this.data.today) return; this.setData({ date: shiftDate(this.data.date, 1) }); this.refresh(); },\n  onToday() { this.setData({ date: todayKey() }); this.refresh(); },\n  onGoToday() { wx.switchTab({ url: '/pages/today/index' }); },\n  async onUndo(event) {\n    if (this.data.busyId) return;\n    const id = event.currentTarget.dataset.id;\n    this.setData({ busyId: id });\n    try { await getApp().store.setCompletion(id, this.data.date, false); wx.showToast({ title: savedToast(getApp().store, '已撤销这次确认'), icon: 'none' }); await this.refresh(); }\n    catch (error) { wx.showToast({ title: '撤销失败，请重试', icon: 'none' }); }\n    finally { this.setData({ busyId: '' }); }\n  }\n});\n","pages/records/index.json":"{ \"navigationBarTitleText\": \"完成记录\", \"enablePullDownRefresh\": true }\n","pages/records/index.wxml":"\u003cview class=\"screen\">\n  \u003ctext class=\"eyebrow\">留住每一次惦记\u003c/text>\n  \u003ctext class=\"page-title\">确认记录\u003c/text>\n  \u003ctext class=\"page-subtitle\">你确认过的日常，都好好记在这里。\u003c/text>\n  \u003cview wx:if=\"{{syncMessage}}\" class=\"notice section-space\">{{syncMessage}}\u003c/view>\n  \u003cview class=\"date-card card row between\">\u003cbutton class=\"date-arrow\" aria-label=\"前一天\" bindtap=\"onPrevious\" disabled=\"{{loading || !!busyId}}\">‹\u003c/button>\u003cpicker mode=\"date\" value=\"{{date}}\" end=\"{{today}}\" bindchange=\"onDate\" disabled=\"{{loading || !!busyId}}\">\u003cview class=\"date-picker\">\u003cview class=\"selected-date\">{{dateLabel}}\u003c/view>\u003cview class=\"date-picker-caption\">{{date}} \u003ctext>⌄\u003c/text>\u003c/view>\u003c/view>\u003c/picker>\u003cbutton class=\"date-arrow\" aria-label=\"后一天\" bindtap=\"onNext\" disabled=\"{{date >= today || loading || !!busyId}}\">›\u003c/button>\u003c/view>\n  \u003cview class=\"row between section-space\">\u003ctext class=\"section-title\">已确认 \u003ctext class=\"record-count\">{{records.length}}\u003c/text> 件小事\u003c/text>\u003cbutton wx:if=\"{{date !== today}}\" class=\"text-button\" bindtap=\"onToday\" disabled=\"{{loading || !!busyId}}\">回到今天\u003c/button>\u003c/view>\n  \u003cview wx:if=\"{{loading}}\" class=\"loading\">正在翻开这一天…\u003c/view>\n  \u003cview wx:elif=\"{{loadError}}\" class=\"card empty section-space\">\u003cview class=\"empty-title\">记录暂时未能加载\u003c/view>\u003cbutton class=\"secondary\" bindtap=\"refresh\">重新加载\u003c/button>\u003c/view>\n  \u003cview wx:elif=\"{{records.length === 0}}\" class=\"card empty section-space\">\u003cview class=\"empty-title\">这一天还没有确认记录\u003c/view>\u003cview class=\"empty-text\">没有记录不代表平台操作未完成。\u003c/view>\u003cbutton class=\"secondary\" bindtap=\"onGoToday\">去今日清单\u003c/button>\u003c/view>\n  \u003cview wx:else class=\"record-list\">\u003cview wx:for=\"{{records}}\" wx:key=\"taskId\" class=\"card record-card row\">\u003cview class=\"avatar {{item.type}}\">{{item.avatar}}\u003c/view>\u003cview class=\"record-info grow\">\u003cview class=\"record-name\">{{item.name}}\u003c/view>\u003cview class=\"record-meta\">{{item.platformLabel}}\u003ctext wx:if=\"{{item.timeLabel}}\"> · {{item.timeLabel}}\u003c/text>\u003c/view>\u003c/view>\u003cbutton class=\"undo-button\" data-id=\"{{item.taskId}}\" bindtap=\"onUndo\" loading=\"{{busyId === item.taskId}}\" disabled=\"{{!!busyId}}\">撤销\u003c/button>\u003c/view>\u003c/view>\n  \u003ctext class=\"record-footnote\">这里只保存你的完成确认，不读取平台火花或打卡状态。\u003c/text>\n\u003c/view>\n","pages/records/index.wxss":"@import \"../shared.wxss\";\n.date-card { margin-top: 35rpx; padding: 24rpx 10rpx; }\n.date-arrow { width: 75rpx; padding: 14rpx; font-size: 38rpx; color: #6b8465; background: transparent; }\n.date-picker { text-align: center; padding: 5rpx 45rpx; }\n.selected-date { font-size: 29rpx; font-weight: 600; }\n.date-picker-caption { margin-top: 9rpx; font-size: 22rpx; color: #929b8d; }\n.date-picker-caption text { margin-left: 9rpx; }\n.record-count { color: #a47543; }\n.record-list { margin-top: 24rpx; }\n.record-card { padding: 25rpx; margin-bottom: 18rpx; }\n.record-info { padding: 0 19rpx; }\n.record-name { font-size: 28rpx; font-weight: 600; word-break: break-all; }\n.record-meta { color: #929a8c; font-size: 21rpx; margin-top: 11rpx; }\n.undo-button { padding: 14rpx 18rpx; background: #f0f2e9; color: #73846b; font-size: 23rpx; flex-shrink: 0; }\n.record-footnote { display: block; text-align: center; font-size: 21rpx; line-height: 1.8; color: #a0a596; margin-top: 30rpx; }\n","pages/settings/index.js":"const { platformLabel } = require('../../utils/domain');\nconst { DEFAULT_SETTINGS, todayKey } = require('../../utils/domain');\nconst { syncMessage, savedToast } = require('../../utils/sync-ui');\n\nPage({\n  data: { time: '21:00', prefs: { ...DEFAULT_SETTINGS }, syncStatus: {}, syncText: '', syncBusy: false, pausedTasks: [], cloud: false, loading: true, loadError: false, busy: false, subscribeBusy: false, clearBusy: false },\n  onShow() { this.refresh(); },\n  async refresh() {\n    const requestId = this._refreshId = (this._refreshId || 0) + 1;\n    this.setData({ loading: true, loadError: false, cloud: getApp().config.storageMode === 'cloud' });\n    try {\n      const [settings, tasks] = await Promise.all([getApp().store.getSettings(), getApp().store.listTasks({ includePaused: true })]);\n      if (requestId !== this._refreshId) return;\n      this.setData({ time: settings.defaultReminderTime || '21:00', prefs: { ...DEFAULT_SETTINGS, ...settings }, pausedTasks: tasks.filter(task => !task.enabled || (task.resumeOn && task.resumeOn > todayKey())).map(task => ({ ...task, platformLabel: platformLabel(task.type) })), syncStatus: getApp().store.getSyncStatus ? getApp().store.getSyncStatus() : {}, syncText: syncMessage(getApp().store) });\n    }\n    catch (error) { if (requestId === this._refreshId) { this.setData({ loadError: true }); wx.showToast({ title: '设置未能加载', icon: 'none' }); } }\n    finally { if (requestId === this._refreshId) this.setData({ loading: false }); }\n  },\n  onPausedTask(event) { wx.navigateTo({ url: `/pages/task-detail/index?id=${encodeURIComponent(event.currentTarget.dataset.id)}` }); },\n  async onTime(event) {\n    if (this.data.busy || this.data.clearBusy) return;\n    this.setData({ busy: true });\n    try { await getApp().store.saveSettings({ defaultReminderTime: event.detail.value }); this.setData({ time: event.detail.value, prefs: { ...this.data.prefs, defaultReminderTime: event.detail.value } }); wx.showToast({ title: savedToast(getApp().store, '默认时间已更新'), icon: 'none' }); }\n    catch (error) { wx.showToast({ title: '保存失败，请重试', icon: 'none' }); }\n    finally { this.setData({ busy: false }); }\n  },\n  async onSubscribe() {\n    if (this.data.subscribeBusy) return;\n    this.setData({ subscribeBusy: true });\n    try { const result = await getApp().reminders.subscribe(); wx.showModal({ title: '微信提醒授权', content: result.message, showCancel: false, confirmColor: '#315d49' }); }\n    catch (error) { wx.showToast({ title: '暂时无法申请微信提醒', icon: 'none' }); }\n    finally { this.setData({ subscribeBusy: false }); }\n  },\n  onCalendarHelp() { wx.showModal({ title: '给具体的小事添加日历', content: '打开「今日」中的一件小事，在详情里点击「添加到手机日历」。添加后请到手机日历核对提醒时间；暂停或删除任务后，日历提醒需要单独调整。', confirmText: '知道了', showCancel: false, confirmColor: '#315d49' }); },\n  onPrefMode(event) { this.setData({ prefs: { ...this.data.prefs, reminderMode: event.currentTarget.dataset.mode } }); },\n  onPrefTime(event) { const field = event.currentTarget.dataset.field; if (['digestTime','quietStart','quietEnd'].includes(field)) this.setData({ prefs: { ...this.data.prefs, [field]: event.detail.value } }); },\n  onQuiet(event) { this.setData({ prefs: { ...this.data.prefs, quietEnabled: event.detail.value } }); },\n  async onSavePreferences() {\n    if (this.data.busy || this.data.clearBusy) return; this.setData({ busy: true });\n    try { await getApp().store.saveSettings(this.data.prefs); await this.refresh(); wx.showToast({ title: savedToast(getApp().store, '提醒偏好已保存'), icon: 'none' }); }\n    catch (error) { wx.showModal({ title: '提醒偏好未保存', content: error.message || '请检查时间设置后重试', showCancel: false }); }\n    finally { this.setData({ busy: false }); }\n  },\n  async onSync() {\n    if (this.data.syncBusy) return; this.setData({ syncBusy: true });\n    try { const status = await getApp().store.syncNow(); await this.refresh(); wx.showToast({ title: status.offline || status.pendingCount || status.conflict ? '仍有未同步内容，请查看提示' : '已同步', icon: 'none' }); }\n    catch (_) { wx.showToast({ title: '请联网验证身份后重试', icon: 'none' }); }\n    finally { this.setData({ syncBusy: false }); }\n  },\n  async onDiscardPending() {\n    if (this.data.syncBusy || !getApp().store.discardPending) return;\n    this.setData({ syncBusy: true });\n    const confirmed = await new Promise(resolve => wx.showModal({ title: '放弃本机待同步修改？', content: '将重新读取云端数据。本机尚未上传的新增、编辑和确认会被放弃，无法恢复。断网时不会丢弃草稿。', confirmText: '放弃修改', success: result => resolve(result.confirm), fail: () => resolve(false) }));\n    try { if (confirmed) { await getApp().store.discardPending(); await this.refresh(); } }\n    catch (_) { wx.showToast({ title: '未取到云端数据，草稿已保留', icon: 'none' }); }\n    finally { this.setData({ syncBusy: false }); }\n  },\n  onManage() { wx.navigateTo({ url: '/pages/tasks/index' }); },\n  onShared() { wx.navigateTo({ url: '/pages/shared/index' }); },\n  onPrivacy() { wx.navigateTo({ url: '/pages/privacy/index' }); },\n  async onClear() {\n    if (this.data.clearBusy || this.data.busy) return;\n    this.setData({ clearBusy: true });\n    const confirmed = await new Promise(resolve => wx.showModal({ title: this.data.cloud ? '清空我的云端数据？' : '清空本机数据？', content: '将删除当前存储中的全部任务、完成记录和偏好设置，无法恢复。已添加到手机日历的提醒不会随之删除。', confirmText: '清空数据', confirmColor: '#ad4f41', success: result => resolve(result.confirm), fail: () => resolve(false) }));\n    if (!confirmed) { this.setData({ clearBusy: false }); return; }\n    try { await getApp().store.clearAll(); await this.refresh(); wx.showToast({ title: '数据已清空', icon: 'success' }); }\n    catch (error) { wx.showToast({ title: '清空失败，请重试', icon: 'none' }); }\n    finally { this.setData({ clearBusy: false }); }\n  }\n});\n","pages/settings/index.json":"{ \"navigationBarTitleText\": \"设置\" }\n","pages/settings/index.wxml":"\u003cview class=\"screen\">\r\n  \u003ctext class=\"eyebrow\">按自己的节奏来\u003c/text>\r\n  \u003ctext class=\"page-title\">让惦记，刚刚好。\u003c/text>\r\n  \u003ctext class=\"page-subtitle\">选择合适的提醒，把小事交给日常。\u003c/text>\r\n  \u003cview wx:if=\"{{loading}}\" class=\"loading\">正在读取设置…\u003c/view>\r\n  \u003cview wx:elif=\"{{loadError}}\" class=\"card empty section-space\">\u003cview class=\"empty-title\">设置暂时未能加载\u003c/view>\u003cbutton class=\"secondary\" bindtap=\"refresh\">重新加载\u003c/button>\u003cview class=\"field-tip\">如果清空过程曾中断，云端需等待五分钟后重试清空。\u003c/view>\u003cbutton class=\"text-button danger-text\" bindtap=\"onClear\" disabled=\"{{clearBusy}}\" loading=\"{{clearBusy}}\">重试清空当前数据\u003c/button>\u003c/view>\r\n  \u003cblock wx:else>\r\n    \u003cview class=\"section-space\">\u003ctext class=\"section-title\">合并提醒与免打扰\u003c/text>\u003cview class=\"card setting-group preference-panel\">\u003cview class=\"setting-name\">微信提醒方式\u003c/view>\u003cview class=\"row preference-options\">\u003cbutton class=\"{{prefs.reminderMode === 'perTime' ? 'chosen' : ''}}\" data-mode=\"perTime\" bindtap=\"onPrefMode\">按任务时间\u003c/button>\u003cbutton class=\"{{prefs.reminderMode === 'digest' ? 'chosen' : ''}}\" data-mode=\"digest\" bindtap=\"onPrefMode\">每日统一汇总\u003c/button>\u003c/view>\u003cview class=\"field-tip\">同一时段合并发送。统一汇总只提醒当天尚未确认的任务。\u003c/view>\u003cpicker wx:if=\"{{prefs.reminderMode === 'digest'}}\" mode=\"time\" value=\"{{prefs.digestTime}}\" data-field=\"digestTime\" bindchange=\"onPrefTime\">\u003cview class=\"setting-row row between\">\u003ctext>每日汇总时间\u003c/text>\u003ctext>{{prefs.digestTime}} ›\u003c/text>\u003c/view>\u003c/picker>\u003cview class=\"setting-row row between\">\u003ctext>睡眠免打扰\u003c/text>\u003cswitch checked=\"{{prefs.quietEnabled}}\" bindchange=\"onQuiet\" color=\"#37634a\" />\u003c/view>\u003cview wx:if=\"{{prefs.quietEnabled}}\">\u003cpicker mode=\"time\" value=\"{{prefs.quietStart}}\" data-field=\"quietStart\" bindchange=\"onPrefTime\">\u003cview class=\"setting-row row between\">\u003ctext>开始\u003c/text>\u003ctext>{{prefs.quietStart}} ›\u003c/text>\u003c/view>\u003c/picker>\u003cpicker mode=\"time\" value=\"{{prefs.quietEnd}}\" data-field=\"quietEnd\" bindchange=\"onPrefTime\">\u003cview class=\"setting-row row between\">\u003ctext>结束\u003c/text>\u003ctext>{{prefs.quietEnd}} ›\u003c/text>\u003c/view>\u003c/picker>\u003c/view>\u003cbutton class=\"primary\" bindtap=\"onSavePreferences\" loading=\"{{busy}}\" disabled=\"{{busy || clearBusy}}\">保存提醒偏好\u003c/button>\u003c/view>\u003cview class=\"notice section-space\">免打扰内的微信提醒会跳过，不补发。已有手机日历由系统独立管理，不应用这里的合并或免打扰设置。\u003c/view>\u003c/view>\r\n    \u003cview wx:if=\"{{cloud}}\" class=\"section-space\">\u003ctext class=\"section-title\">离线与同步\u003c/text>\u003cview class=\"card preference-panel\">\u003cview>{{syncText || '当前没有待同步修改'}}\u003c/view>\u003cview class=\"field-tip\">待同步：{{syncStatus.pendingCount || 0}} 项\u003c/view>\u003cview wx:if=\"{{syncStatus.lastSyncedAt}}\" class=\"field-tip\">上次同步：{{syncStatus.lastSyncedAt}}\u003c/view>\u003cbutton class=\"secondary\" bindtap=\"onSync\" loading=\"{{syncBusy}}\" disabled=\"{{syncBusy}}\">重新同步\u003c/button>\u003cbutton wx:if=\"{{syncStatus.conflict}}\" class=\"text-button\" bindtap=\"onDiscardPending\" disabled=\"{{syncBusy}}\">放弃本机草稿，使用云端数据\u003c/button>\u003c/view>\u003cview class=\"field-tip\">每次重新打开时需要先联网验证当前身份，然后可离线查看和编辑本机缓存。共同任务需联网。\u003c/view>\u003c/view>\r\n    \u003cview class=\"row section-space\">\u003cbutton class=\"text-button\" bindtap=\"onManage\">管理全部任务 ›\u003c/button>\u003cbutton class=\"text-button\" bindtap=\"onShared\">双方共同任务 ›\u003c/button>\u003c/view>\r\n    \u003cview class=\"section-space\">\u003ctext class=\"section-title\">提醒偏好\u003c/text>\u003cview class=\"card setting-group\">\u003cpicker mode=\"time\" value=\"{{time}}\" bindchange=\"onTime\" disabled=\"{{busy || clearBusy}}\">\u003cview class=\"setting-row row between\">\u003cview class=\"grow\">\u003cview class=\"setting-name\">默认提醒时间\u003c/view>\u003cview class=\"setting-tip\">用于之后新建的任务\u003c/view>\u003c/view>\u003ctext class=\"setting-value\">{{time}}\u003c/text>\u003ctext class=\"chevron\">›\u003c/text>\u003c/view>\u003c/picker>\u003cview class=\"divider\">\u003c/view>\u003cbutton class=\"setting-row setting-button row between\" bindtap=\"onSubscribe\" loading=\"{{subscribeBusy}}\" disabled=\"{{subscribeBusy}}\">\u003cview class=\"grow\">\u003cview class=\"setting-name\">微信消息提醒\u003c/view>\u003cview class=\"setting-tip\">点击申请，以实际授权结果为准\u003c/view>\u003c/view>\u003ctext class=\"chevron\">›\u003c/text>\u003c/button>\u003cview class=\"divider\">\u003c/view>\u003cbutton class=\"setting-row setting-button row between\" bindtap=\"onCalendarHelp\">\u003cview class=\"grow\">\u003cview class=\"setting-name\">手机日历提醒\u003c/view>\u003cview class=\"setting-tip\">在每件小事的详情中单独添加\u003c/view>\u003c/view>\u003ctext class=\"chevron\">›\u003c/text>\u003c/button>\u003c/view>\u003cview class=\"notice reminder-notice\">微信订阅消息需要你主动授权，不能保证无限期每日发送。日历提醒由手机系统管理，请检查通知权限。\u003c/view>\u003c/view>\r\n    \u003cview wx:if=\"{{pausedTasks.length}}\" class=\"section-space\">\u003ctext class=\"section-title\">暂停的小事\u003c/text>\u003cview class=\"card setting-group\">\u003cblock wx:for=\"{{pausedTasks}}\" wx:key=\"id\">\u003cview wx:if=\"{{index > 0}}\" class=\"divider\">\u003c/view>\u003cbutton class=\"setting-row setting-button row between\" data-id=\"{{item.id}}\" bindtap=\"onPausedTask\">\u003cview class=\"grow\">\u003cview class=\"setting-name\">{{item.name}}\u003c/view>\u003cview class=\"setting-tip\">{{item.platformLabel}} · 点开详情可以恢复\u003c/view>\u003c/view>\u003ctext class=\"chevron\">›\u003c/text>\u003c/button>\u003c/block>\u003c/view>\u003c/view>\r\n    \u003cview class=\"section-space\">\u003ctext class=\"section-title\">数据与隐私\u003c/text>\u003cview class=\"card setting-group\">\u003cview class=\"setting-row\">\u003cview class=\"row between\">\u003cview class=\"setting-name\">当前存储方式\u003c/view>\u003ctext class=\"pill green\">{{cloud ? '微信云开发' : '本机存储'}}\u003c/text>\u003c/view>\u003cview class=\"setting-tip mode-description\">{{cloud ? '云端数据与本机离线缓存分开保存。待同步修改尚未上传，联网并收到回执后才算同步完成。' : '任务和记录保存在当前设备的小程序缓存中，暂不跨设备同步。清理缓存可能造成数据丢失。'}}\u003c/view>\u003c/view>\u003cview class=\"divider\">\u003c/view>\u003cbutton class=\"setting-row setting-button row between\" bindtap=\"onPrivacy\">\u003ctext class=\"setting-name\">隐私说明\u003c/text>\u003ctext class=\"chevron\">›\u003c/text>\u003c/button>\u003cview class=\"divider\">\u003c/view>\u003cbutton class=\"setting-row setting-button row between\" bindtap=\"onClear\" loading=\"{{clearBusy}}\" disabled=\"{{clearBusy || busy}}\">\u003ctext class=\"setting-name danger-text\">{{cloud ? '清空我的云端数据' : '清空本机数据'}}\u003c/text>\u003ctext class=\"chevron\">›\u003c/text>\u003c/button>\u003c/view>\u003c/view>\r\n    \u003cview class=\"about\">\u003cview class=\"about-name\">续一下 \u003ctext>✦\u003c/text>\u003c/view>\u003cview class=\"about-copy\">把在意的，续下去。\u003c/view>\u003cview class=\"about-version\">V 0.3.1 · 今日清单体验优化\u003c/view>\u003c/view>\r\n  \u003c/block>\r\n\u003c/view>\r\n","pages/settings/index.wxss":"@import \"../shared.wxss\";\n.preference-panel { padding: 26rpx; margin-top: 22rpx; }\n.preference-options { gap: 14rpx; margin-top: 18rpx; }\n.preference-options button { flex: 1; padding: 20rpx 12rpx; min-height: 44px; background: #e9eee4; color: #315d49; font-size: 25rpx; }\n.preference-options button.chosen { background: #315d49; color: #fff; }\n.preference-panel .secondary { margin-top: 22rpx; }\n.setting-group { overflow: hidden; margin-top: 22rpx; }\n.setting-row { padding: 28rpx 26rpx; }\n.setting-button { display: flex; text-align: left; width: 100%; background: transparent; border-radius: 0; font-weight: 400; }\n.setting-name { font-size: 27rpx; }\n.setting-tip { font-size: 22rpx; color: #929b8a; margin-top: 11rpx; line-height: 1.75; }\n.setting-value { font-size: 29rpx; color: #55754f; font-weight: 600; letter-spacing: 1rpx; }\n.reminder-notice { margin-top: 18rpx; font-size: 22rpx; }\n.mode-description { margin-top: 18rpx; }\n.danger-text { color: #a86753; }\n.about { text-align: center; padding: 49rpx 0 12rpx; }\n.about-name { font-size: 31rpx; font-weight: 600; color: #768369; }\n.about-name text { color: #bc9568; margin-left: 8rpx; }\n.about-copy { color: #9ba18e; font-size: 23rpx; margin-top: 13rpx; }\n.about-version { font-size: 19rpx; color: #b0b5a6; margin-top: 18rpx; }\n","pages/shared/index.js":"Page({\n  data: { cloud: false, loading: false, busy: false, loadError: false, title: '', type: 'douyin', joints: [], invitation: null, inviteToken: '', inviteJointId: '', inviteTitle: '', expiresAt: '' },\n  onLoad(options) { this._incoming = options.invite || ''; this.setData({ cloud: !!getApp().config.cloudEnabled }); },\n  onShow() { this.refresh(); },\n  async refresh() {\n    if (!this.data.cloud) return;\n    const requestId = this._refreshId = (this._refreshId || 0) + 1;\n    this.setData({ loading: true, loadError: false });\n    try {\n      const joints = await getApp().store.shared('listJoints', {});\n      let invitation = null;\n      if (this._incoming) invitation = await getApp().store.shared('previewInvitation', { token: this._incoming });\n      if (requestId === this._refreshId) this.setData({ joints, invitation });\n    } catch (error) { if (requestId === this._refreshId) { this.setData({ loadError: true }); wx.showModal({ title: '共同任务暂时不可用', content: error.message || '请联网后重试', showCancel: false }); } }\n    finally { if (requestId === this._refreshId) this.setData({ loading: false }); }\n  },\n  onTitle(event) { this._createRequestId = ''; this.setData({ title: event.detail.value }); },\n  onType(event) { this._createRequestId = ''; this.setData({ type: event.currentTarget.dataset.type }); },\n  async perform(action, payload, after) {\n    if (this.data.busy) return; this.setData({ busy: true });\n    try { const result = await getApp().store.shared(action, payload); if (after) after(result); await this.refresh(); }\n    catch (error) { wx.showModal({ title: '操作未完成', content: error.message || '请联网后重试', showCancel: false }); }\n    finally { this.setData({ busy: false }); }\n  },\n  onCreate() {\n    const title = this.data.title.trim();\n    if (!title || Array.from(title).length > 40) { wx.showToast({ title: '请输入1—40字的任务名称', icon: 'none' }); return; }\n    if (!this._createRequestId) this._createRequestId = 'joint_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,12);\n    return this.perform('createJoint', { title, type: this.data.type, requestId: this._createRequestId }, () => { this._createRequestId = ''; this.setData({ title: '' }); });\n  },\n  onJoin() { return this.perform('joinJoint', { token: this._incoming }, () => { this._incoming = ''; this.setData({ invitation: null }); }); },\n  onComplete(event) { const id = event.currentTarget.dataset.id, task = this.data.joints.find(item => item.id === id); if (task) return this.perform('setJointCompletion', { id, completed: !task.meConfirmed }); },\n  async onInvite(event) {\n    const id = event.currentTarget.dataset.id, task = this.data.joints.find(item => item.id === id);\n    return this.perform('createInvitation', { id }, result => this.setData({ inviteToken: result.token, inviteJointId: id, inviteTitle: task.title, expiresAt: result.expiresAt }));\n  },\n  onShareAppMessage() { return this.data.inviteToken ? { title: '邀请你加入：' + this.data.inviteTitle, path: '/pages/shared/index?invite=' + this.data.inviteToken } : { title: '续一下 · 双方共同任务', path: '/pages/shared/index' }; },\n  async onLeave(event) {\n    if (this.data.busy) return;\n    const confirmed = await new Promise(resolve => wx.showModal({ title: '退出或关闭共同任务？', content: '参与者退出后不再共享状态；发起人退出会关闭此任务。不会修改双方的私人任务或手机日历。', success: result => resolve(result.confirm), fail: () => resolve(false) }));\n    if (confirmed) return this.perform('leaveJoint', { id: event.currentTarget.dataset.id }, () => this.setData({ inviteToken: '', inviteJointId: '' }));\n  },\n  onPersonalReminder(event) { const task = this.data.joints.find(item => item.id === event.currentTarget.dataset.id); if (task) wx.navigateTo({ url: '/pages/task-form/index?title=' + encodeURIComponent(task.title) + '&type=' + task.type }); }\n});\n","pages/shared/index.json":"{ \"navigationBarTitleText\": \"共同任务\", \"enableShareAppMessage\": true }\n","pages/shared/index.wxml":"\u003cview class=\"screen\">\u003ctext class=\"page-title\">共同任务\u003c/text>\u003ctext class=\"page-subtitle\">双方自愿加入，各自确认。这里只共享任务名称、平台和本工具内的确认状态。\u003c/text>\u003cview wx:if=\"{{!cloud}}\" class=\"notice section-space\">共同任务需要配置云开发并联网使用。当前本机模式仍可使用私人清单，不会生成虚假的参与者状态。\u003c/view>\u003cblock wx:else>\u003cview wx:if=\"{{invitation}}\" class=\"card joint-card\">\u003cview class=\"section-title\">邀请你加入：{{invitation.title}}\u003c/view>\u003ctext class=\"field-tip\">加入后，发起人可以看到你在本工具里的当日确认。不会读取你的私人任务或聊天。\u003c/text>\u003cbutton wx:if=\"{{!invitation.alreadyMember}}\" class=\"primary\" bindtap=\"onJoin\" disabled=\"{{busy}}\">同意加入\u003c/button>\u003ctext wx:else class=\"field-tip\">你已经在这个任务中。\u003c/text>\u003c/view>\u003cview wx:if=\"{{loadError}}\" class=\"notice section-space\">暂时无法核对双方状态，请联网刷新。\u003cbutton class=\"text-button\" bindtap=\"refresh\">重新加载\u003c/button>\u003c/view>\u003cview class=\"card joint-card\">\u003ctext class=\"section-title\">发起一个共同任务\u003c/text>\u003cinput class=\"field-input\" value=\"{{title}}\" maxlength=\"40\" placeholder=\"例如：每天互相问候\" bindinput=\"onTitle\" />\u003cview class=\"row platform-picks\">\u003cbutton class=\"{{type === 'douyin' ? 'chosen' : ''}}\" data-type=\"douyin\" bindtap=\"onType\">抖音\u003c/button>\u003cbutton class=\"{{type === 'weibo' ? 'chosen' : ''}}\" data-type=\"weibo\" bindtap=\"onType\">微博\u003c/button>\u003c/view>\u003cbutton class=\"primary\" bindtap=\"onCreate\" loading=\"{{busy}}\" disabled=\"{{busy}}\">创建共同任务\u003c/button>\u003c/view>\u003cview wx:if=\"{{loading}}\" class=\"loading\">正在核对双方状态…\u003c/view>\u003cblock wx:elif=\"{{!loadError}}\">\u003cview wx:for=\"{{joints}}\" wx:key=\"id\" class=\"card joint-card\">\u003cview class=\"section-title\">{{item.title}}\u003c/view>\u003cview class=\"field-tip\">{{item.date}} · {{item.isCreator ? '你发起的' : '你加入的'}}\u003c/view>\u003cview class=\"state-grid\">\u003cview>\u003ctext>我\u003c/text>\u003cview>{{item.meConfirmed ? '已确认' : '未确认'}}\u003c/view>\u003c/view>\u003cview>\u003ctext>对方\u003c/text>\u003cview>{{!item.joined ? '等待加入' : item.otherConfirmed ? '已确认' : '未确认'}}\u003c/view>\u003c/view>\u003c/view>\u003cbutton class=\"{{item.meConfirmed ? 'secondary' : 'primary'}}\" data-id=\"{{item.id}}\" bindtap=\"onComplete\" disabled=\"{{busy}}\">{{item.meConfirmed ? '撤销我的确认' : '我已在平台完成'}}\u003c/button>\u003cbutton wx:if=\"{{item.isCreator && !item.joined}}\" class=\"secondary\" data-id=\"{{item.id}}\" bindtap=\"onInvite\" disabled=\"{{busy}}\">生成24小时邀请\u003c/button>\u003cview wx:if=\"{{inviteToken && inviteJointId === item.id}}\">\u003ctext class=\"field-tip\">重新生成后旧邀请失效。有效至 {{expiresAt}}\u003c/text>\u003cbutton class=\"secondary\" open-type=\"share\">选择好友发送邀请\u003c/button>\u003c/view>\u003cbutton class=\"text-button\" data-id=\"{{item.id}}\" bindtap=\"onPersonalReminder\">为我自己新建提醒\u003c/button>\u003cbutton class=\"text-button danger-text\" data-id=\"{{item.id}}\" bindtap=\"onLeave\" disabled=\"{{busy}}\">{{item.isCreator ? '关闭共同任务' : '退出共同任务'}}\u003c/button>\u003c/view>\u003c/block>\u003cview class=\"notice section-space\">共同任务需要联网，不离线猜测对方状态。私人提醒需各自创建和授权。\u003c/view>\u003c/block>\u003c/view>\n","pages/shared/index.wxss":"@import \"../shared.wxss\";\n.joint-card { padding: 28rpx; margin-top: 26rpx; }\n.joint-card .field-input { margin-top: 20rpx; }\n.joint-card .primary,.joint-card .secondary { margin-top: 18rpx; }\n.state-grid { display: flex; gap: 20rpx; margin: 24rpx 0; }\n.state-grid > view { flex: 1; background: #edf1e8; color: #315d49; border-radius: 16rpx; padding: 22rpx; }\n.platform-picks { gap: 12rpx; margin-top: 18rpx; }\n.platform-picks button { flex: 1; min-height: 44px; padding: 16rpx; background: #edf1e8; color: #315d49; }\n.platform-picks .chosen { background: #315d49; color: #fff; }\n","pages/shared.wxss":"page { background: #f7f6f1; color: #243b32; font-family: -apple-system, BlinkMacSystemFont, \"PingFang SC\", \"Microsoft YaHei\", sans-serif; font-size: 28rpx; }\nview, text, button, input, textarea { box-sizing: border-box; }\nbutton { margin: 0; border: 0; border-radius: 22rpx; font-size: 28rpx; line-height: 1.45; font-weight: 600; }\nbutton::after { border: none; }\nbutton[disabled] { opacity: .48; }\n.screen { padding: 34rpx 34rpx calc(42rpx + env(safe-area-inset-bottom)); }\n.eyebrow { color: #78887e; font-size: 20rpx; letter-spacing: 4rpx; font-weight: 600; }\n.page-title { display: block; margin-top: 14rpx; font-size: 50rpx; line-height: 1.3; font-weight: 650; letter-spacing: -1rpx; }\n.page-subtitle { display: block; margin-top: 16rpx; color: #7a877e; font-size: 25rpx; line-height: 1.7; }\n.row { display: flex; align-items: center; }\n.between { justify-content: space-between; }\n.grow { flex: 1; min-width: 0; }\n.muted { color: #829087; }\n.small { font-size: 23rpx; line-height: 1.65; }\n.card { background: #fffefb; border: 1rpx solid #e9ece5; border-radius: 28rpx; }\n.section-title { font-weight: 650; font-size: 29rpx; }\n.section-space { margin-top: 36rpx; }\n.primary { background: #275c47; color: #fffef9; padding: 26rpx 24rpx; }\n.secondary { background: #ebf0e8; color: #315d49; padding: 25rpx 24rpx; }\n.text-button { background: transparent; color: #3f6853; padding: 14rpx 0; font-size: 24rpx; }\n.danger { color: #ad4f41; background: #faf0eb; padding: 25rpx; }\n.notice { padding: 23rpx 26rpx; background: #eeefe7; color: #727d70; border-radius: 20rpx; font-size: 23rpx; line-height: 1.8; }\n.orange { color: #bd7543; }\n.pill { display: inline-flex; align-items: center; border-radius: 999rpx; padding: 8rpx 15rpx; background: #f2f1e9; color: #7c8578; font-size: 21rpx; line-height: 1.4; }\n.pill.green { background: #e7eee4; color: #447459; }\n.pill.orange { background: #faeee1; color: #bd7543; }\n.avatar { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 78rpx; height: 78rpx; border-radius: 24rpx; background: #e8eddf; color: #587459; font-size: 31rpx; font-weight: 600; }\n.avatar.weibo { background: #f5eade; color: #ba8050; }\n.empty { text-align: center; padding: 66rpx 32rpx; }\n.empty-symbol { font-size: 48rpx; color: #769474; margin-bottom: 22rpx; }\n.empty-title { font-size: 31rpx; font-weight: 600; }\n.empty-text { margin-top: 15rpx; font-size: 25rpx; color: #879087; line-height: 1.85; }\n.empty .primary { margin-top: 30rpx; }\n.loading { text-align: center; padding: 60rpx 20rpx; color: #879087; font-size: 25rpx; }\n.divider { height: 1rpx; background: #eceee7; }\n.field-label { display: block; margin-bottom: 17rpx; font-size: 26rpx; font-weight: 600; }\n.field-tip { display: block; margin-top: 14rpx; font-size: 23rpx; color: #889084; line-height: 1.7; }\n.field-input { width: 100%; min-height: 94rpx; border: 1rpx solid #e7e9e1; border-radius: 20rpx; background: #fffefa; padding: 20rpx 24rpx; font-size: 28rpx; color: #273d32; }\n.field-textarea { height: 185rpx; line-height: 1.7; }\n.error { color: #b65545; display: block; font-size: 23rpx; margin-top: 12rpx; }\n.chevron { color: #9ba699; margin-left: 16rpx; font-size: 32rpx; }\n.actions { margin-top: 30rpx; }\n.actions button + button { margin-top: 18rpx; }\n.button-caption { display: block; text-align: center; color: #8b9389; font-size: 22rpx; line-height: 1.7; margin-top: 17rpx; }\n","pages/task-detail/index.js":"const { todayKey, decorateTasks, shiftDate } = require('../../utils/domain');\nconst { syncMessage, savedToast } = require('../../utils/sync-ui');\n\nPage({\n  data: { id: '', task: null, date: '', loading: true, loadError: false, busy: false, calendarBusy: false, subscribeBusy: false, isNew: false, copied: false, temporarilyPaused: false, syncMessage: '', reminderStatus: { wechatConfigured: false, calendarAdded: false, calendarNeedsReview: false, calendarHint: '尚未在本机添加日历提醒' } },\n  onLoad(options) { this.setData({ id: options.id || '', isNew: options.created === '1' }); },\n  onShow() { this.refresh(); },\n  async refresh() {\n    const requestId = this._refreshId = (this._refreshId || 0) + 1;\n    const date = todayKey();\n    this.setData({ loading: true, date, loadError: false });\n    try {\n      const [task, records] = await Promise.all([getApp().store.getTask(this.data.id), getApp().store.listRecords({ date })]);\n      if (requestId !== this._refreshId) return;\n      this.setData({ task: task ? decorateTasks([task], records, date)[0] : null, copied: !!task && task.greeting === this._copiedGreeting, temporarilyPaused: !!task && !!task.resumeOn && task.resumeOn > date, syncMessage: syncMessage(getApp().store) });\n      this.updateReminderStatus();\n    } catch (error) { if (requestId === this._refreshId) { this.setData({ loadError: true }); wx.showToast({ title: '详情未能加载', icon: 'none' }); } }\n    finally { if (requestId === this._refreshId) this.setData({ loading: false }); }\n  },\n  onEdit() { if (this.data.task) wx.navigateTo({ url: `/pages/task-form/index?id=${encodeURIComponent(this.data.id)}` }); },\n  updateReminderStatus() {\n    const reminders = getApp().reminders;\n    if (typeof reminders.getStatus === 'function') this.setData({ reminderStatus: reminders.getStatus(this.data.task) });\n  },\n  onToday() { wx.switchTab({ url: '/pages/today/index' }); },\n  onStartTask() { this.setData({ isNew: false }); },\n  onDuplicate() { if (this.data.task) wx.navigateTo({ url: '/pages/task-form/index?copyFrom=' + encodeURIComponent(this.data.id) }); },\n  async onPin() {\n    if (this.data.busy || !this.data.task) return;\n    this.setData({ busy: true });\n    try { await getApp().store.saveTask({ ...this.data.task, pinned: !this.data.task.pinned }); await this.refresh(); }\n    catch (_) { wx.showToast({ title: '置顶设置未保存，请重试', icon: 'none' }); }\n    finally { this.setData({ busy: false }); }\n  },\n  async onPauseWeek() {\n    if (this.data.busy || !this.data.task) return;\n    this.setData({ busy: true });\n    const resumeOn = shiftDate(todayKey(), 7);\n    const confirmed = await new Promise(resolve => wx.showModal({ title: '暂停一周？', content: '从今天起暂停7天，' + resumeOn + '起按原周期恢复。已有手机日历不会自动暂停。', confirmText: '暂停一周', success: result => resolve(result.confirm), fail: () => resolve(false) }));\n    try { if (confirmed) { await getApp().store.saveTask({ ...this.data.task, enabled: true, resumeOn }); await this.refresh(); } }\n    catch (_) { wx.showToast({ title: '暂停未保存，请重试', icon: 'none' }); }\n    finally { this.setData({ busy: false }); }\n  },\n  onCopy() {\n    if (!this.data.task || !this.data.task.greeting) return;\n    const greeting = this.data.task.greeting;\n    wx.setClipboardData({ data: greeting, success: () => { this._copiedGreeting = greeting; this.setData({ copied: !!this.data.task && this.data.task.greeting === greeting }); wx.showToast({ title: '已复制，尚未发送', icon: 'none' }); }, fail: () => wx.showToast({ title: '复制失败，请重试', icon: 'none' }) });\n  },\n  async onComplete() {\n    if (this.data.busy || !this.data.task) return;\n    const completed = this.data.task.completed;\n    this.setData({ busy: true });\n    try {\n      if (todayKey() !== this.data.date) {\n        await this.refresh();\n        wx.showToast({ title: '日期已更新，请重新确认', icon: 'none' });\n        return;\n      }\n      if (!this.data.task.scheduledToday && !completed) { wx.showToast({ title: '今天未安排该任务', icon: 'none' }); return; }\n      await getApp().store.setCompletion(this.data.id, this.data.date, !completed);\n      wx.showToast({ title: savedToast(getApp().store, completed ? '已撤销确认' : '今天已确认'), icon: 'none' });\n      await this.refresh();\n    } catch (error) { wx.showToast({ title: '保存失败，请重试', icon: 'none' }); }\n    finally { this.setData({ busy: false }); }\n  },\n  async onCalendar() {\n    if (this.data.calendarBusy || !this.data.task) return;\n    this.setData({ calendarBusy: true });\n    try {\n      const result = await getApp().reminders.addCalendar(this.data.task);\n      if (result.status === 'cancelled') return;\n      this.updateReminderStatus();\n      if (result.status === 'added') wx.showToast({ title: '日历日程已添加', icon: 'success' });\n      else wx.showModal({ title: '手机日历提醒', content: result.message, showCancel: false, confirmColor: '#315d49' });\n    } catch (error) { wx.showToast({ title: '暂时无法添加日历提醒', icon: 'none' }); }\n    finally { this.setData({ calendarBusy: false }); }\n  },\n  async onSubscribe() {\n    if (this.data.subscribeBusy) return;\n    this.setData({ subscribeBusy: true });\n    try {\n      const result = await getApp().reminders.subscribe();\n      wx.showModal({ title: '微信提醒授权', content: result.message, showCancel: false, confirmColor: '#315d49' });\n    } catch (error) { wx.showToast({ title: '暂时无法申请微信提醒', icon: 'none' }); }\n    finally { this.setData({ subscribeBusy: false }); }\n  },\n  async onToggle() {\n    if (this.data.busy || !this.data.task) return;\n    const enabled = !this.data.task.enabled || this.data.temporarilyPaused;\n    this.setData({ busy: true });\n    const confirmed = await new Promise(resolve => wx.showModal({ title: enabled ? '恢复这件小事？' : '暂停这件小事？', content: enabled ? '恢复后会重新显示在每日清单。' : '暂停后暂不显示在每日清单，已有完成记录保留。已添加的日历提醒需到手机日历中单独关闭。', confirmText: enabled ? '恢复' : '暂停', confirmColor: '#315d49', success: result => resolve(result.confirm), fail: () => resolve(false) }));\n    if (!confirmed) { this.setData({ busy: false }); return; }\n    try { await getApp().store.toggleTask(this.data.id, enabled); await this.refresh(); wx.showToast({ title: enabled ? '已恢复' : '已暂停', icon: 'success' }); }\n    catch (error) { wx.showToast({ title: '操作失败，请重试', icon: 'none' }); }\n    finally { this.setData({ busy: false }); }\n  },\n  async onDelete() {\n    if (this.data.busy || !this.data.task) return;\n    this.setData({ busy: true });\n    const confirmed = await new Promise(resolve => wx.showModal({ title: '删除这件小事？', content: '删除后无法恢复。手机日历中已添加的提醒需要单独删除。', confirmText: '删除', confirmColor: '#ad4f41', success: result => resolve(result.confirm), fail: () => resolve(false) }));\n    if (!confirmed) { this.setData({ busy: false }); return; }\n    try { await getApp().store.deleteTask(this.data.id); wx.showToast({ title: '已删除', icon: 'success' }); wx.navigateBack({ fail: () => wx.switchTab({ url: '/pages/today/index' }) }); }\n    catch (error) { wx.showToast({ title: '删除失败，请重试', icon: 'none' }); this.setData({ busy: false }); }\n  }\n});\n","pages/task-detail/index.json":"{\r\n  \"navigationBarTitleText\": \"任务详情\"\r\n}\r\n","pages/task-detail/index.wxml":"\u003cview class=\"screen\">\r\n  \u003cview wx:if=\"{{loading}}\" class=\"loading\">正在读取这件小事…\u003c/view>\r\n  \u003cview wx:elif=\"{{loadError}}\" class=\"card empty\">\u003cview class=\"empty-title\">详情暂时未能加载\u003c/view>\u003cbutton class=\"secondary\" bindtap=\"refresh\">重新加载\u003c/button>\u003c/view>\r\n  \u003cview wx:elif=\"{{!task}}\" class=\"card empty\">\u003cview class=\"empty-title\">这件小事已不存在\u003c/view>\u003cview class=\"empty-text\">返回清单，看看其他在意的事。\u003c/view>\u003c/view>\r\n  \u003cblock wx:else>\r\n    \u003cview wx:if=\"{{syncMessage}}\" class=\"notice\">{{syncMessage}}\u003c/view>\r\n    \u003cview wx:if=\"{{isNew}}\" class=\"saved-notice\">\u003cview class=\"saved-title\">任务已保存\u003c/view>\u003ctext>接下来选择提醒方式。只保存清单不会自动通知你。\u003c/text>\u003c/view>\r\n    \u003cview class=\"row between\">\u003ctext class=\"eyebrow\">每日小事 · {{task.platformLabel}}\u003c/text>\u003cbutton class=\"text-button\" bindtap=\"onEdit\" disabled=\"{{busy}}\">编辑\u003c/button>\u003c/view>\r\n    \u003cview class=\"detail-avatar avatar {{task.type}}\">{{task.avatar}}\u003c/view>\r\n    \u003ctext class=\"page-title detail-title\">{{task.name}}\u003c/text>\r\n    \u003cview class=\"row detail-badges\">\u003ctext class=\"pill {{task.completed ? 'green' : 'orange'}}\">{{task.completed ? '今天已确认' : task.scheduledToday ? '今天待确认' : '今天未安排'}}\u003c/text>\u003ctext class=\"pill\">{{task.pinned ? '已置顶' : task.enabled ? '周期任务' : '已暂停'}}\u003c/text>\u003c/view>\r\n    \u003cview class=\"card info-card\">\u003cview class=\"row between\">\u003ctext class=\"muted\">希望提醒的时间\u003c/text>\u003ctext class=\"reminder-time\">{{task.time}}\u003c/text>\u003c/view>\u003cview class=\"field-tip\">{{task.repeatLabel}}\u003c/view>\u003cview class=\"row\">\u003cbutton class=\"text-button\" bindtap=\"onPin\" disabled=\"{{busy}}\">{{task.pinned ? '取消置顶' : '置顶重要对象'}}\u003c/button>\u003cbutton class=\"text-button\" bindtap=\"onDuplicate\" disabled=\"{{busy}}\">复制为新任务\u003c/button>\u003c/view>\u003cview wx:if=\"{{task.note}}\" class=\"note-detail\">\u003ctext class=\"small muted\">备注\u003c/text>\u003cview class=\"note-text\">{{task.note}}\u003c/view>\u003c/view>\u003c/view>\r\n    \u003cview wx:if=\"{{isNew}}\" class=\"section-space\">\u003ctext class=\"section-title\">提醒方式\u003c/text>\u003cview class=\"reminder-actions card\">\u003cbutton class=\"reminder-row row between\" bindtap=\"onCalendar\" loading=\"{{calendarBusy}}\" disabled=\"{{calendarBusy || !task.enabled}}\">\u003cview class=\"grow\">\u003cview class=\"reminder-name\">{{reminderStatus.calendarAdded ? '查看或重新添加日历' : '添加手机日历提醒'}}\u003c/view>\u003cview class=\"small muted reminder-caption\">{{reminderStatus.calendarHint}}\u003c/view>\u003c/view>\u003ctext class=\"chevron\">›\u003c/text>\u003c/button>\u003cview class=\"divider\">\u003c/view>\u003cbutton class=\"reminder-row row between\" bindtap=\"onSubscribe\" loading=\"{{subscribeBusy}}\" disabled=\"{{subscribeBusy}}\">\u003cview class=\"grow\">\u003cview class=\"reminder-name\">微信消息提醒 · {{reminderStatus.wechatConfigured ? '需主动订阅' : '暂未启用'}}\u003c/view>\u003cview class=\"small muted reminder-caption\">{{reminderStatus.wechatConfigured ? '一次性订阅不代表永久每天通知' : '当前可先使用清单和手机日历'}}\u003c/view>\u003c/view>\u003ctext class=\"chevron\">›\u003c/text>\u003c/button>\u003c/view>\u003ctext wx:if=\"{{reminderStatus.calendarNeedsReview}}\" class=\"calendar-warning\">请在手机日历单独调整原日程，勿直接重复添加。\u003c/text>\u003c/view>\r\n    \u003cbutton wx:if=\"{{isNew}}\" class=\"secondary return-button\" bindtap=\"onToday\">返回今日清单\u003c/button>\r\n    \u003cbutton wx:if=\"{{isNew}}\" class=\"text-button\" bindtap=\"onStartTask\">暂不设置，查看处理步骤\u003c/button>\r\n    \u003cblock wx:if=\"{{!isNew}}\">\r\n    \u003cview class=\"notice section-space\">\u003cview class=\"instruction-title\">{{task.type === 'douyin' ? '续火花的处理步骤' : '微博打卡的处理步骤'}}\u003c/view>\u003cview>1. {{task.type === 'douyin' ? '自行打开抖音，找到对应好友。' : '自行打开微博，找到打卡目标。'}}\u003c/view>\u003cview>2. {{task.type === 'douyin' ? '按抖音当前规则完成互动。' : '完成对应的签到或打卡。'}}\u003c/view>\u003cview>3. 回到这里，点击「确认已完成」。\u003c/view>\u003c/view>\r\n    \u003cview wx:if=\"{{task.greeting}}\" class=\"section-space\">\u003cview class=\"row between\">\u003ctext class=\"section-title\">准备文案\u003c/text>\u003cbutton class=\"text-button\" bindtap=\"onCopy\">{{copied ? '再次复制' : '复制文案'}}\u003c/button>\u003c/view>\u003cview class=\"greeting-card\">{{task.greeting}}\u003c/view>\u003ctext wx:if=\"{{copied}}\" class=\"copy-feedback\">已复制，尚未发送。请自行打开{{task.type === 'douyin' ? '抖音' : '微博'}}使用。\u003c/text>\u003c/view>\r\n    \u003cview class=\"actions\">\u003cbutton class=\"{{task.completed ? 'secondary' : 'primary'}}\" bindtap=\"onComplete\" loading=\"{{busy}}\" disabled=\"{{busy || loading || (!task.scheduledToday && !task.completed)}}\">{{task.completed ? '撤销今天的确认' : task.scheduledToday ? '确认已完成' : '今天未安排'}}\u003c/button>\u003ctext class=\"button-caption\">请先在对应平台完成操作。这里只记录你的确认。\u003c/text>\u003c/view>\r\n    \u003cview class=\"section-space\">\u003ctext class=\"section-title\">提醒方式\u003c/text>\u003cview class=\"reminder-actions card\">\u003cbutton class=\"reminder-row row between\" bindtap=\"onCalendar\" loading=\"{{calendarBusy}}\" disabled=\"{{calendarBusy || !task.enabled}}\">\u003cview class=\"grow\">\u003cview class=\"reminder-name\">{{reminderStatus.calendarAdded ? '查看或重新添加日历' : '添加手机日历提醒'}}\u003c/view>\u003cview class=\"small muted reminder-caption\">{{reminderStatus.calendarHint}}\u003c/view>\u003c/view>\u003ctext class=\"chevron\">›\u003c/text>\u003c/button>\u003cview class=\"divider\">\u003c/view>\u003cbutton class=\"reminder-row row between\" bindtap=\"onSubscribe\" loading=\"{{subscribeBusy}}\" disabled=\"{{subscribeBusy}}\">\u003cview class=\"grow\">\u003cview class=\"reminder-name\">微信消息提醒 · {{reminderStatus.wechatConfigured ? '需主动订阅' : '暂未启用'}}\u003c/view>\u003cview class=\"small muted reminder-caption\">{{reminderStatus.wechatConfigured ? '一次性订阅不代表永久每天通知' : '当前可先使用清单和手机日历'}}\u003c/view>\u003c/view>\u003ctext class=\"chevron\">›\u003c/text>\u003c/button>\u003c/view>\u003ctext wx:if=\"{{reminderStatus.calendarNeedsReview}}\" class=\"calendar-warning\">请在手机日历单独调整原日程，勿直接重复添加。\u003c/text>\u003c/view>\r\n    \u003c/block>\r\n    \u003cview class=\"manage-actions row\">\u003cbutton class=\"text-button\" bindtap=\"onPauseWeek\" disabled=\"{{busy}}\">暂停一周\u003c/button>\u003cbutton class=\"text-button\" bindtap=\"onToggle\" disabled=\"{{busy}}\">{{task.enabled && !temporarilyPaused ? '一直暂停' : '立即恢复'}}\u003c/button>\u003cbutton class=\"text-button delete-button\" bindtap=\"onDelete\" disabled=\"{{busy}}\">删除\u003c/button>\u003c/view>\r\n  \u003c/block>\r\n\u003c/view>\r\n","pages/task-detail/index.wxss":"@import \"../shared.wxss\";\n.detail-avatar { width: 112rpx; height: 112rpx; border-radius: 31rpx; font-size: 45rpx; margin-top: 30rpx; }\n.detail-title { margin-top: 24rpx; word-break: break-all; }\n.detail-badges { margin-top: 23rpx; }\n.detail-badges .pill { margin-right: 12rpx; }\n.info-card { padding: 27rpx; margin-top: 33rpx; font-size: 25rpx; }\n.reminder-time { font-size: 30rpx; font-weight: 600; }\n.note-detail { border-top: 1rpx solid #eceee7; margin-top: 24rpx; padding-top: 22rpx; }\n.note-text { white-space: pre-wrap; word-break: break-all; line-height: 1.8; margin-top: 8rpx; color: #5b705e; }\n.greeting-card { background: #f1ede2; color: #7c7964; border-radius: 23rpx; line-height: 1.9; padding: 27rpx; margin-top: 10rpx; white-space: pre-wrap; word-break: break-all; }\n.reminder-actions { margin-top: 22rpx; overflow: hidden; }\n.reminder-row { display: flex; text-align: left; width: 100%; padding: 25rpx; background: transparent; border-radius: 0; font-weight: 400; }\n.reminder-name { font-size: 26rpx; color: #3d5e46; }\n.reminder-caption { font-size: 20rpx; margin-top: 8rpx; }\n.manage-actions { justify-content: center; margin-top: 29rpx; }\n.manage-dot { color: #bcc1b3; padding: 0 28rpx; }\n.delete-button { color: #aa7562; }\n.saved-notice { padding: 24rpx; margin-bottom: 26rpx; border-radius: 20rpx; background: #e8efe2; color: #48664b; font-size: 24rpx; line-height: 1.7; }\n.saved-title { font-weight: 600; font-size: 28rpx; margin-bottom: 6rpx; }\n.instruction-title { color: #3c5f46; font-weight: 600; margin-bottom: 12rpx; }\n.copy-feedback { display: block; margin-top: 14rpx; color: #48664b; font-size: 24rpx; line-height: 1.7; }\n.calendar-warning { display: block; margin-top: 14rpx; color: #976539; font-size: 24rpx; line-height: 1.7; }\n.return-button { margin-top: 30rpx; }\n","pages/task-form/index.js":"const { validateTask } = require('../../utils/domain');\nconst { savedToast } = require('../../utils/sync-ui');\n\nPage({\n  data: { id: '', type: 'douyin', name: '', time: '21:00', note: '', greeting: '今天也来续一下，记得照顾好自己。', enabled: true, repeat: 'daily', weekDays: [], weekOptions: [], pinned: false, resumeOn: '', copying: false, errors: {}, loading: true, busy: false },\n  async onLoad(options) {\n    const id = options.id || '';\n    this.setData({ id });\n    if (id) wx.setNavigationBarTitle({ title: '编辑任务' });\n    try {\n      if (id || options.copyFrom) {\n        const task = await getApp().store.getTask(id || options.copyFrom);\n        if (!task) { wx.showToast({ title: '这件小事已不存在', icon: 'none' }); this.setData({ unavailable: true }); return; }\n        this.setData({ type: task.type, name: id ? task.name : '', time: task.time, note: task.note || '', greeting: task.greeting || '', enabled: id ? task.enabled : true, repeat: task.repeat || 'daily', weekDays: task.weekDays || [], pinned: id ? !!task.pinned : false, resumeOn: id ? task.resumeOn || '' : '', copying: !id });\n      } else {\n        const settings = await getApp().store.getSettings();\n        this.setData({ time: settings.defaultReminderTime || '21:00' });\n        if (options.title) { let name = options.title; try { name = decodeURIComponent(name); } catch (_) {} this.setData({ name, type: options.type === 'weibo' ? 'weibo' : 'douyin' }); }\n      }\n      this.updateWeekOptions();\n    } catch (error) { wx.showToast({ title: '读取失败，请返回重试', icon: 'none' }); this.setData({ unavailable: true }); }\n    finally { this.setData({ loading: false }); }\n  },\n  onType(event) {\n    const type = event.currentTarget.dataset.type;\n    const patch = { type, errors: {} };\n    if (this.data.greeting === '今天也来续一下，记得照顾好自己。' || this.data.greeting === '') patch.greeting = type === 'douyin' ? '今天也来续一下，记得照顾好自己。' : '';\n    this.setData(patch);\n  },\n  onInput(event) { this.setData({ [event.currentTarget.dataset.field]: event.detail.value, errors: {} }); },\n  onTime(event) { this.setData({ time: event.detail.value, errors: {} }); },\n  onEnabled(event) { this.setData({ enabled: event.detail.value }); },\n  onPinned(event) { this.setData({ pinned: event.detail.value }); },\n  onRepeat(event) { this.setData({ repeat: event.currentTarget.dataset.repeat, errors: {} }); this.updateWeekOptions(); },\n  updateWeekOptions() { this.setData({ weekOptions: [1,2,3,4,5,6,7].map(day => ({ day, label: '一二三四五六日'[day-1], selected: this.data.weekDays.includes(day) })) }); },\n  onWeekDay(event) { const day = Number(event.currentTarget.dataset.day); this.setData({ weekDays: this.data.weekDays.includes(day) ? this.data.weekDays.filter(value => value !== day) : [...this.data.weekDays, day], errors: {} }); this.updateWeekOptions(); },\n  async onSave() {\n    if (this.data.busy || this.data.loading || this.data.unavailable) return;\n    const result = validateTask({ id: this.data.id || undefined, type: this.data.type, name: this.data.name, time: this.data.time, note: this.data.note, greeting: this.data.greeting, enabled: this.data.enabled, repeat: this.data.repeat, weekDays: this.data.weekDays, pinned: this.data.pinned, resumeOn: this.data.resumeOn });\n    if (!result.valid) { this.setData({ errors: result.errors }); wx.showToast({ title: '请检查填写内容', icon: 'none' }); return; }\n    this.setData({ busy: true });\n    try {\n      if (!this.data.id) {\n        const tasks = await getApp().store.listTasks({ includePaused: true });\n        const duplicate = tasks.some(task => task.type === result.value.type && task.name.toLowerCase() === result.value.name.toLowerCase());\n        if (duplicate) {\n          const confirmed = await new Promise(resolve => wx.showModal({ title: '已有同名任务', content: '清单中已有同平台、同名称的任务。仍要再添加一条吗？', confirmText: '仍然添加', cancelText: '返回检查', success: answer => resolve(answer.confirm), fail: () => resolve(false) }));\n          if (!confirmed) return;\n        }\n      }\n      const task = await getApp().store.saveTask({ ...result.value, ...(this.data.id ? { id: this.data.id } : {}) });\n      wx.showToast({ title: savedToast(getApp().store, '任务已保存'), icon: 'none' });\n      if (!this.data.id) {\n        wx.redirectTo({ url: `/pages/task-detail/index?id=${encodeURIComponent(task.id)}&created=1`, fail: () => wx.switchTab({ url: '/pages/today/index' }) });\n      } else {\n        const pages = getCurrentPages();\n        if (pages.length > 1) wx.navigateBack(); else wx.switchTab({ url: '/pages/today/index' });\n      }\n    } catch (error) { wx.showToast({ title: '保存失败，请重试', icon: 'none' }); }\n    finally { this.setData({ busy: false }); }\n  }\n});\n","pages/task-form/index.json":"{\r\n  \"navigationBarTitleText\": \"新建任务\"\r\n}\r\n","pages/task-form/index.wxml":"\u003cview class=\"screen\">\n  \u003ctext class=\"eyebrow\">留一点时间 · 给重要的小事\u003c/text>\n  \u003ctext class=\"page-title\">{{id ? '编辑提醒任务' : '新建提醒任务'}}\u003c/text>\n  \u003ctext class=\"page-subtitle\">填写对象和时间，保存后再选择提醒方式。\u003c/text>\n  \u003cview wx:if=\"{{loading}}\" class=\"loading\">正在读取…\u003c/view>\n  \u003cview wx:elif=\"{{unavailable}}\" class=\"notice section-space\">暂时无法编辑，请返回清单后重试。\u003c/view>\n  \u003cblock wx:else>\n    \u003cview wx:if=\"{{copying}}\" class=\"notice section-space\">已复制原任务的周期、时间和文案。请填写新对象名称，原任务不会被修改。\u003c/view>\n    \u003cview class=\"form-section\">\u003ctext class=\"field-label\">选择平台\u003c/text>\u003cview class=\"row platform-options\">\u003cview class=\"platform-option {{type === 'douyin' ? 'selected' : ''}}\" data-type=\"douyin\" bindtap=\"onType\">\u003ctext class=\"platform-symbol\">✦\u003c/text>\u003ctext>抖音续火花\u003c/text>\u003ctext class=\"option-check\">{{type === 'douyin' ? '✓' : ''}}\u003c/text>\u003c/view>\u003cview class=\"platform-option {{type === 'weibo' ? 'selected' : ''}}\" data-type=\"weibo\" bindtap=\"onType\">\u003ctext class=\"platform-symbol orange\">◎\u003c/text>\u003ctext>微博打卡\u003c/text>\u003ctext class=\"option-check\">{{type === 'weibo' ? '✓' : ''}}\u003c/text>\u003c/view>\u003c/view>\u003ctext wx:if=\"{{errors.type}}\" class=\"error\">{{errors.type}}\u003c/text>\u003c/view>\n    \u003cview class=\"form-section\">\u003ctext class=\"field-label\">{{type === 'douyin' ? '好友备注' : '打卡目标'}}\u003c/text>\u003cinput class=\"field-input\" value=\"{{name}}\" placeholder=\"{{type === 'douyin' ? '例如：小林' : '例如：每天去喜欢的超话签到'}}\" maxlength=\"40\" data-field=\"name\" bindinput=\"onInput\" />\u003ctext wx:if=\"{{errors.name}}\" class=\"error\">{{errors.name}}\u003c/text>\u003ctext class=\"field-tip\">用自己熟悉的名字即可，不需要账号或密码。\u003c/text>\u003c/view>\n    \u003cview class=\"form-section\">\u003ctext class=\"field-label\">希望提醒的时间\u003c/text>\u003cpicker mode=\"time\" value=\"{{time}}\" bindchange=\"onTime\">\u003cview class=\"field-input row between\">\u003ctext class=\"time-value\">{{time}}\u003c/text>\u003ctext class=\"time-unit\">选择时间 \u003ctext class=\"chevron\">›\u003c/text>\u003c/text>\u003c/view>\u003c/picker>\u003ctext wx:if=\"{{errors.time}}\" class=\"error\">{{errors.time}}\u003c/text>\u003ctext class=\"field-tip\">保存后可在详情添加日历提醒。微信消息需要单独授权；修改时间后，请同步检查已添加的日历事项。\u003c/text>\u003c/view>\n    \u003cview class=\"form-section\">\u003ctext class=\"field-label\">重复周期（北京时间）\u003c/text>\u003cview class=\"repeat-options row\">\u003cbutton class=\"{{repeat === 'daily' ? 'selected' : ''}}\" data-repeat=\"daily\" bindtap=\"onRepeat\">每天\u003c/button>\u003cbutton class=\"{{repeat === 'weekdays' ? 'selected' : ''}}\" data-repeat=\"weekdays\" bindtap=\"onRepeat\">周一至周五\u003c/button>\u003cbutton class=\"{{repeat === 'custom' ? 'selected' : ''}}\" data-repeat=\"custom\" bindtap=\"onRepeat\">自选星期\u003c/button>\u003c/view>\u003cview wx:if=\"{{repeat === 'custom'}}\" class=\"week-options\">\u003cbutton wx:for=\"{{weekOptions}}\" wx:key=\"day\" class=\"{{item.selected ? 'selected' : ''}}\" data-day=\"{{item.day}}\" bindtap=\"onWeekDay\">{{item.label}}\u003c/button>\u003c/view>\u003ctext wx:if=\"{{errors.repeat}}\" class=\"error\">{{errors.repeat}}\u003c/text>\u003ctext class=\"field-tip\">“周一至周五”不按法定节假日调休。\u003c/text>\u003c/view>\n    \u003cview class=\"card enabled-card row between\">\u003cview class=\"grow\">\u003cview class=\"enabled-title\">重要对象置顶\u003c/view>\u003ctext class=\"field-tip\">未确认任务中优先显示\u003c/text>\u003c/view>\u003cswitch checked=\"{{pinned}}\" color=\"#37634a\" bindchange=\"onPinned\" />\u003c/view>\n    \u003cview class=\"form-section\">\u003ctext class=\"field-label\">备注 \u003ctext class=\"optional\">选填\u003c/text>\u003c/text>\u003ctextarea class=\"field-input field-textarea note-area\" value=\"{{note}}\" placeholder=\"例如：晚饭后记得来看看\" maxlength=\"200\" data-field=\"note\" bindinput=\"onInput\" />\u003ctext wx:if=\"{{errors.note}}\" class=\"error\">{{errors.note}}\u003c/text>\u003c/view>\n    \u003cview class=\"form-section\">\u003ctext class=\"field-label\">快捷复制文案 \u003ctext class=\"optional\">选填\u003c/text>\u003c/text>\u003ctextarea class=\"field-input field-textarea\" value=\"{{greeting}}\" placeholder=\"写下一句想说的话，详情页可一键复制\" maxlength=\"200\" data-field=\"greeting\" bindinput=\"onInput\" />\u003ctext wx:if=\"{{errors.greeting}}\" class=\"error\">{{errors.greeting}}\u003c/text>\u003ctext class=\"field-tip\">复制后需要你到对应平台粘贴、发送或完成打卡。\u003c/text>\u003c/view>\n    \u003cview class=\"card enabled-card row between\">\u003cview class=\"grow\">\u003cview class=\"enabled-title\">启用此任务\u003c/view>\u003ctext class=\"field-tip\">开启后按周期进入今日清单\u003c/text>\u003c/view>\u003cswitch checked=\"{{enabled}}\" color=\"#37634a\" bindchange=\"onEnabled\" />\u003c/view>\n    \u003cview class=\"actions\">\u003cbutton class=\"primary\" loading=\"{{busy}}\" disabled=\"{{busy}}\" bindtap=\"onSave\">{{id ? '保存修改' : '保存，选择提醒方式'}}\u003c/button>\u003ctext class=\"button-caption\">保存清单不会自动开启通知，也不会代发消息。\u003c/text>\u003c/view>\n  \u003c/block>\n\u003c/view>\n","pages/task-form/index.wxss":"@import \"../shared.wxss\";\n.form-section { margin-top: 37rpx; }\n.platform-options { margin-right: -15rpx; }\n.platform-option { display: flex; align-items: center; width: calc(50% - 15rpx); border: 2rpx solid #e6e8df; padding: 24rpx 18rpx; margin-right: 15rpx; border-radius: 21rpx; font-size: 25rpx; background: #fffefa; }\n.platform-option.selected { border-color: #6b8861; background: #edf1e6; }\n.platform-symbol { margin-right: 12rpx; color: #67805d; font-size: 30rpx; }\n.option-check { margin-left: auto; padding-left: 4rpx; color: #4e7251; font-size: 23rpx; }\n.time-value { font-size: 35rpx; letter-spacing: 2rpx; font-weight: 600; }\n.time-unit { color: #8d9689; font-size: 24rpx; }\n.optional { color: #a0a696; font-size: 22rpx; font-weight: 400; margin-left: 9rpx; }\n.note-area { height: 146rpx; }\n.enabled-card { padding: 23rpx; margin-top: 30rpx; }\n.enabled-title { font-size: 27rpx; font-weight: 600; }\n.enabled-card .field-tip { margin-top: 8rpx; font-size: 21rpx; }\n.enabled-card switch { transform: scale(.85); transform-origin: right center; }\n.repeat-options { gap: 10rpx; flex-wrap: wrap; }\n.repeat-options button,.week-options button { min-height: 44px; padding: 16rpx 20rpx; background: #ecefe5; color: #536d52; font-size: 25rpx; }\n.repeat-options .selected,.week-options .selected { background: #315d49; color: #fff; }\n.week-options { display: flex; gap: 8rpx; flex-wrap: wrap; margin-top: 18rpx; }\n.week-options button { flex: 1; min-width: 60rpx; padding: 12rpx 5rpx; }\n","pages/tasks/index.js":"const { todayKey, decorateTasks } = require('../../utils/domain');\nconst { syncMessage } = require('../../utils/sync-ui');\nPage({\n  data: { tasks: [], visible: [], query: '', loading: true, message: '' },\n  onShow() { this.refresh(); },\n  async refresh() {\n    this.setData({ loading: true });\n    try { const tasks = await getApp().store.listTasks({ includePaused: true }); this.setData({ tasks: decorateTasks(tasks, [], todayKey()), message: syncMessage(getApp().store) }); this.filter(); }\n    catch (_) { wx.showToast({ title: '任务未加载，请联网后重试', icon: 'none' }); }\n    finally { this.setData({ loading: false }); }\n  },\n  filter() { const q = this.data.query.trim().toLowerCase(); this.setData({ visible: this.data.tasks.filter(task => !q || task.name.toLowerCase().includes(q)) }); },\n  onSearch(event) { this.setData({ query: event.detail.value }); this.filter(); },\n  onDetail(event) { wx.navigateTo({ url: '/pages/task-detail/index?id=' + encodeURIComponent(event.currentTarget.dataset.id) }); },\n  onCreate() { wx.navigateTo({ url: '/pages/task-form/index' }); }\n});\n","pages/tasks/index.json":"{ \"navigationBarTitleText\": \"全部任务\" }\n","pages/tasks/index.wxml":"\u003cview class=\"screen\">\u003cview class=\"row between\">\u003ctext class=\"page-title\">全部任务\u003c/text>\u003cbutton class=\"text-button\" bindtap=\"onCreate\">＋ 新建\u003c/button>\u003c/view>\u003ctext class=\"page-subtitle\">包含非今日周期和暂停中的任务。\u003c/text>\u003cview wx:if=\"{{message}}\" class=\"notice section-space\">{{message}}\u003c/view>\u003cinput class=\"field-input section-space\" placeholder=\"搜索对象\" value=\"{{query}}\" bindinput=\"onSearch\" />\u003cview wx:if=\"{{loading}}\" class=\"loading\">正在加载…\u003c/view>\u003cview wx:elif=\"{{!visible.length}}\" class=\"notice section-space\">没有匹配的任务。\u003c/view>\u003cbutton wx:for=\"{{visible}}\" wx:key=\"id\" class=\"card task-row\" data-id=\"{{item.id}}\" bindtap=\"onDetail\">\u003cview class=\"row between\">\u003ctext>{{item.pinned ? '置顶 · ' : ''}}{{item.name}}\u003c/text>\u003ctext class=\"pill\">{{!item.enabled ? '一直暂停' : item.scheduledToday ? '今日安排' : '非今日安排'}}\u003c/text>\u003c/view>\u003cview class=\"field-tip\">{{item.platformLabel}} · {{item.time}}\u003c/view>\u003cview class=\"field-tip\">{{item.repeatLabel}}\u003c/view>\u003c/button>\u003c/view>\n","pages/tasks/index.wxss":"@import \"../shared.wxss\";\n.task-row { display: block; width: 100%; text-align: left; padding: 26rpx; margin-top: 20rpx; color: #31513e; }\n","pages/today/index.js":"const { todayKey, decorateTasks, formatDateLabel, isTaskOnDate } = require('../../utils/domain');\nconst { syncMessage, savedToast } = require('../../utils/sync-ui');\nconst { todayView } = require('../../utils/today-view');\n\nPage({\n  data: { date: '', dateLabel: '', tasks: [], visibleTasks: [], query: '', filter: 'all', statusFilter: 'pending', statusCounts: { all: 0, pending: 0, confirmed: 0 }, total: 0, completed: 0, remaining: 0, pausedCount: 0, progress: 0, hasLoaded: false, loading: true, refreshing: false, stale: false, loadError: false, busyId: '', lastAction: null, reminderHint: '微信消息提醒暂未启用', syncMessage: '' },\n  onShow() { this._visible = true; this.setData({ lastAction: null }); this.startClock(); return this.refresh(); },\n  onHide() { this.stopClock(); },\n  onUnload() { this.stopClock(); this._refreshId = (this._refreshId || 0) + 1; },\n  stopClock() { this._visible = false; clearTimeout(this._clock); this._clock = null; },\n  startClock() {\n    clearTimeout(this._clock);\n    this._clock = setTimeout(() => {\n      if (!this._visible) return;\n      if (todayKey() !== this.data.date) { this.setData({ lastAction: null }); this.refresh(); }\n      else { this.applyFilter(); const message = syncMessage(getApp().store); if (message !== this.data.syncMessage) this.setData({ syncMessage: message }); }\n      this.startClock();\n    }, 30000);\n  },\n  onPullDownRefresh() { this.refresh().finally(() => wx.stopPullDownRefresh()); },\n  async refresh() {\n    const requestId = this._refreshId = (this._refreshId || 0) + 1;\n    const date = todayKey();\n    const config = getApp().config;\n    const keepList = this.data.hasLoaded && this.data.date === date;\n    this.setData({ loading: !keepList, refreshing: keepList, loadError: false, stale: false, reminderHint: config.cloudEnabled && config.subscriptionTemplateId ? '微信消息需主动订阅' : '微信消息提醒暂未启用', syncMessage: syncMessage(getApp().store) });\n    if (!keepList) this.setData({ date, dateLabel: formatDateLabel(date), tasks: [], visibleTasks: [], total: 0, completed: 0, remaining: 0, pausedCount: 0, progress: 0, lastAction: null, hasLoaded: false, statusCounts: { all: 0, pending: 0, confirmed: 0 } });\n    try {\n      const [tasks, records] = await Promise.all([getApp().store.listTasks({ includePaused: true }), getApp().store.listRecords({ date })]);\n      if (requestId !== this._refreshId) return;\n      if (todayKey() !== date) return this.refresh();\n      const decorated = decorateTasks(tasks.filter(task => isTaskOnDate(task, date)), records, date);\n      const completed = decorated.filter(task => task.completed).length;\n      this.setData({ tasks: decorated, hasLoaded: true, total: decorated.length, completed, remaining: decorated.length - completed, pausedCount: tasks.filter(task => !isTaskOnDate(task, date)).length, progress: decorated.length ? Math.round(completed / decorated.length * 100) : 0, syncMessage: syncMessage(getApp().store) });\n      this.applyFilter();\n    } catch (error) {\n      if (requestId !== this._refreshId) return;\n      this.setData({ loadError: !keepList, stale: keepList, syncMessage: syncMessage(getApp().store) });\n      wx.showToast({ title: '清单暂时未能加载', icon: 'none' });\n    } finally { if (requestId === this._refreshId) this.setData({ loading: false, refreshing: false }); }\n  },\n  applyFilter() {\n    const view = todayView(this.data.tasks, { date: this.data.date, query: this.data.query, filter: this.data.filter, statusFilter: this.data.statusFilter, now: Date.now() });\n    const patch = {};\n    for (const [key, value] of Object.entries(view)) if (JSON.stringify(this.data[key]) !== JSON.stringify(value)) patch[key] = value;\n    if (Object.keys(patch).length) this.setData(patch);\n  },\n  onSearch(event) { this.setData({ query: event.detail.value }); this.applyFilter(); },\n  onFilter(event) { const filter = event.currentTarget.dataset.type; if (!['all', 'douyin', 'weibo'].includes(filter)) return; this.setData({ filter }); this.applyFilter(); },\n  onStatusFilter(event) { const statusFilter = event.currentTarget.dataset.status; if (!['all', 'pending', 'confirmed'].includes(statusFilter)) return; this.setData({ statusFilter }); this.applyFilter(); },\n  onClearSearch() { this.setData({ query: '' }); this.applyFilter(); },\n  onResetFilters() { this.setData({ query: '', filter: 'all', statusFilter: 'pending' }); this.applyFilter(); },\n  onEmptyAction() { if (this.data.emptyAction === 'reset') this.onResetFilters(); else this.onStatusFilter({ currentTarget: { dataset: { status: this.data.emptyAction } } }); },\n  onCreate() { wx.navigateTo({ url: '/pages/task-form/index' }); },\n  onReminderSettings() { wx.switchTab({ url: '/pages/settings/index' }); },\n  onManage() { wx.navigateTo({ url: '/pages/tasks/index' }); },\n  onShared() { wx.navigateTo({ url: '/pages/shared/index' }); },\n  onDetail(event) { wx.navigateTo({ url: `/pages/task-detail/index?id=${encodeURIComponent(event.currentTarget.dataset.id)}` }); },\n  async onComplete(event) {\n    if (this.data.busyId || this.data.loading || this.data.refreshing || this.data.stale || this.data.loadError) return;\n    const id = event.currentTarget.dataset.id;\n    const task = this.data.tasks.find(item => item.id === id);\n    if (!task) return;\n    const date = this.data.date;\n    this.setData({ busyId: id });\n    try {\n      if (todayKey() !== date) {\n        await this.refresh();\n        wx.showToast({ title: '日期已更新，请重新确认', icon: 'none' });\n        return;\n      }\n      await getApp().store.setCompletion(id, date, !task.completed);\n      this.setData({ lastAction: todayKey() === date && this.data.date === date ? { id, name: task.name, completed: !task.completed, date } : null });\n      wx.showToast({ title: savedToast(getApp().store, task.completed ? '已撤销确认' : '今天已确认'), icon: 'none' });\n      await this.refresh();\n    } catch (error) { wx.showToast({ title: '保存失败，请重试', icon: 'none' }); }\n    finally { this.setData({ busyId: '' }); }\n  },\n  async onUndoLast() {\n    if (this.data.busyId || this.data.loading || this.data.refreshing || this.data.stale || !this.data.lastAction) return;\n    const action = this.data.lastAction;\n    this.setData({ busyId: action.id });\n    try {\n      if (action.date !== todayKey()) { this.setData({ lastAction: null }); await this.refresh(); return; }\n      await getApp().store.setCompletion(action.id, action.date, !action.completed);\n      this.setData({ lastAction: null });\n      await this.refresh();\n      wx.showToast({ title: savedToast(getApp().store, '已撤销刚才的操作'), icon: 'none' });\n    } catch (_) { wx.showToast({ title: '撤销失败，请重试', icon: 'none' }); }\n    finally { this.setData({ busyId: '' }); }\n  }\n});\n","pages/today/index.json":"{ \"navigationBarTitleText\": \"续一下\", \"enablePullDownRefresh\": true, \"backgroundColor\": \"#f7f6f1\" }\n","pages/today/index.wxml":"\u003cview class=\"screen\">\n  \u003cview class=\"row between header-row\">\u003ctext class=\"eyebrow\">续一下 · 每日提醒\u003c/text>\u003ctext class=\"date-label\">{{dateLabel}}\u003c/text>\u003c/view>\n  \u003ctext class=\"page-title\">今日待办\u003c/text>\n  \u003cview wx:if=\"{{syncMessage}}\" class=\"notice section-space\">\u003ctext>{{syncMessage}}\u003c/text>\u003cbutton class=\"text-button\" bindtap=\"onReminderSettings\">查看同步状态\u003c/button>\u003c/view>\n  \u003cview class=\"reminder-banner row between\">\u003ctext class=\"grow\">{{reminderHint}}\u003c/text>\u003cbutton class=\"text-button\" bindtap=\"onReminderSettings\">设置提醒 ›\u003c/button>\u003c/view>\n  \u003cview class=\"daily-card\">\n    \u003cview class=\"row between\">\u003cview>\u003ctext class=\"daily-label\">还有 \u003c/text>\u003ctext class=\"count-number\">{{loading ? '…' : remaining}}\u003c/text>\u003ctext class=\"daily-label\"> 项待确认\u003c/text>\u003c/view>\u003ctext class=\"count-total\">{{loading ? '正在读取' : '已确认 ' + completed + ' / ' + total}}\u003c/text>\u003c/view>\n    \u003cview class=\"progress-track\">\u003cview class=\"progress-fill\" style=\"width:{{progress}}%\">\u003c/view>\u003c/view>\n    \u003cview class=\"progress-caption\">{{loading ? '正在读取今天的计划' : total === 0 ? '新建任务后，再选择提醒方式' : remaining === 0 ? '今天的清单都已确认' : '请先在对应平台处理，再回来确认'}}\u003c/view>\n  \u003c/view>\n  \u003cview class=\"row between section-space\">\u003cbutton class=\"text-button\" bindtap=\"onManage\">全部任务 ›\u003c/button>\u003cbutton class=\"text-button\" bindtap=\"onShared\">共同任务 ›\u003c/button>\u003cbutton class=\"add-button\" bindtap=\"onCreate\">＋ 新建\u003c/button>\u003c/view>\n  \u003cview class=\"search-box row\">\u003cinput class=\"search-input\" placeholder=\"搜索好友、打卡目标\" placeholder-class=\"search-placeholder\" value=\"{{query}}\" bindinput=\"onSearch\" maxlength=\"60\" confirm-type=\"search\" />\u003cbutton wx:if=\"{{query}}\" class=\"clear-search\" bindtap=\"onClearSearch\" aria-label=\"仅清除搜索文字，保留筛选\">清除\u003c/button>\u003c/view>\n  \u003cview class=\"filter-row row\">\u003cbutton class=\"filter {{filter === 'all' ? 'active' : ''}}\" data-type=\"all\" bindtap=\"onFilter\">全部\u003c/button>\u003cbutton class=\"filter {{filter === 'douyin' ? 'active' : ''}}\" data-type=\"douyin\" bindtap=\"onFilter\">抖音\u003c/button>\u003cbutton class=\"filter {{filter === 'weibo' ? 'active' : ''}}\" data-type=\"weibo\" bindtap=\"onFilter\">微博\u003c/button>\u003c/view>\n  \u003cview class=\"status-tabs row\">\u003cbutton class=\"status-tab {{statusFilter === 'pending' ? 'selected' : ''}}\" data-status=\"pending\" bindtap=\"onStatusFilter\" aria-label=\"查看待确认任务\">待确认 {{statusCounts.pending}}\u003c/button>\u003cbutton class=\"status-tab {{statusFilter === 'confirmed' ? 'selected' : ''}}\" data-status=\"confirmed\" bindtap=\"onStatusFilter\" aria-label=\"查看已确认任务\">已确认 {{statusCounts.confirmed}}\u003c/button>\u003cbutton class=\"status-tab {{statusFilter === 'all' ? 'selected' : ''}}\" data-status=\"all\" bindtap=\"onStatusFilter\" aria-label=\"查看全部状态的任务\">全部 {{statusCounts.all}}\u003c/button>\u003c/view>\n  \u003cview wx:if=\"{{refreshing}}\" class=\"list-hint\">正在更新，清单会保留在这里…\u003c/view>\n  \u003cview wx:if=\"{{stale}}\" class=\"notice stale-notice row between\">\u003ctext class=\"grow\">刷新未完成，当前显示上次读取的清单。重新加载后可继续确认。\u003c/text>\u003cbutton class=\"text-button\" bindtap=\"refresh\">重新加载\u003c/button>\u003c/view>\n  \u003cview wx:if=\"{{lastAction}}\" class=\"undo-notice row between\">\u003ctext class=\"grow\">{{lastAction.name}}{{lastAction.completed ? '已确认' : '已撤销确认'}}\u003c/text>\u003cbutton class=\"text-button\" bindtap=\"onUndoLast\" disabled=\"{{!!busyId || refreshing || stale}}\">撤销刚才操作\u003c/button>\u003c/view>\n  \u003cview wx:if=\"{{loading}}\" class=\"loading\">正在加载清单…\u003c/view>\n  \u003cview wx:elif=\"{{loadError}}\" class=\"card empty\">\u003cview class=\"empty-title\">清单暂时未能加载\u003c/view>\u003cview class=\"empty-text\">原有任务未被清除，请稍后重试。\u003c/view>\u003cbutton class=\"secondary\" bindtap=\"refresh\">重新加载\u003c/button>\u003c/view>\n  \u003cblock wx:else>\n    \u003cview wx:for=\"{{visibleTasks}}\" wx:key=\"id\" class=\"card task-card {{item.completed ? 'is-complete' : ''}}\">\n      \u003cview class=\"row\">\u003cview class=\"avatar {{item.type}}\">{{item.avatar}}\u003c/view>\u003cview class=\"task-info grow\">\u003cview class=\"task-name\">{{item.pinned ? '置顶 · ' : ''}}{{item.name}}\u003c/view>\u003cview class=\"task-meta\">{{item.platformLabel}} · {{item.time}}\u003c/view>\u003c tch (_) { cache = previous; throw error('本机快照保存失败，原草稿已保留', 'CACHE_WRITE_FAILED'); }\n    lastFetched = Date.now(); status.offline = false; status.lastError = ''; status.conflict = false;\n  }\n  async function initialize() {\n    if (scope && cache && !blockedIdentity) return;\n    if (!networkAvailable) throw error('请先联网验证当前身份，再使用离线缓存', 'CLOUD_UNAVAILABLE');\n    if (!initPromise) initPromise = (async () => {\n      // 每次冷启动先在线验证当前用户；不把上一账号的缓存当作离线登录。\n      const session = await remote.call('getSession');\n      if (!session || typeof session.scope !== 'string' || !/^[a-f0-9]{64}$/.test(session.scope)) throw error('身份验证结果异常', 'SESSION_INVALID');\n      scope = session.scope;\n      blockedIdentity = false;\n      const stored = api.getStorageSync(storageKey());\n      if (stored && (stored.version !== 1 || stored.scope !== scope || !Array.isArray(stored.queue) || !stored.state)) throw error('离线草稿格式异常，请联系维护者，不会覆盖原数据', 'CACHE_INVALID');\n      cache = stored ? clone(stored) : null;\n      status.verified = true;\n      if (!cache) await snapshot(); else { status.pendingCount = cache.queue.length; status.lastSyncedAt = cache.lastSyncedAt || ''; }\n    })().finally(() => { initPromise = null; });\n    await initPromise;\n  }\n  async function flush() {\n    if (!networkAvailable) { status.offline = true; status.pendingCount = cache.queue.length; status.lastError = '网络已断开，修改等待同步'; return false; }\n    while (cache.queue.length) {\n      const mutation = cache.queue[0];\n      try {\n        const receipt = await remote.call('commitOffline', { scope, expectedRevision: cache.revision, mutation });\n        const previous = cache;\n        cache = { ...cache, revision: receipt.revision, queue: cache.queue.slice(1) };\n        try { persist(); } catch (_) { cache = previous; throw error('同步回执未能保存在本机，将安全重试', 'CACHE_WRITE_FAILED'); }\n        status.offline = false; status.lastError = ''; status.conflict = false;\n      } catch (problem) {\n        status.offline = problem.code === 'CLOUD_UNAVAILABLE';\n        status.conflict = !status.offline;\n        status.lastError = problem.message;\n        if (problem.code === 'SESSION_CHANGED') blockedIdentity = true;\n        status.pendingCount = cache.queue.length;\n        return false;\n      }\n    }\n    return true;\n  }\n  async function ready(force) {\n    await initialize();\n    if (cache.queue.length && !(await flush())) { if (blockedIdentity) throw error(status.lastError, 'SESSION_CHANGED'); return; }\n    if (!networkAvailable) { status.offline = true; return; }\n    if (!force && Date.now() - lastFetched \u003c 1500) return;\n    try { await snapshot(); }\n    catch (problem) {\n      if (problem.code === 'SESSION_CHANGED') { blockedIdentity = true; status.conflict = true; }\n      if (problem.code !== 'CLOUD_UNAVAILABLE') throw problem;\n      status.offline = true; status.lastError = '当前显示本机缓存';\n    }\n  }\n  function local(state) {\n    return createLocalStore({\n      getStorageSync: () => clone(state.value),\n      setStorageSync: (_, value) => { state.value = clone(value); },\n      removeStorageSync: () => {}\n    });\n  }\n  function read(method, args) {\n    return run(async () => { await ready(false); return local({ value: cache.state })[method](...args); });\n  }\n  function mutate(kind, parameters, localArgs) {\n    return run(async () => {\n      await ready(false);\n      if (cache.queue.length >= 500) throw error('待同步操作较多，请先联网同步', 'QUEUE_LIMIT');\n      const draft = { value: clone(cache.state) };\n      const result = await local(draft)[kind](...localArgs);\n      const previous = cache;\n      cache = { ...cache, state: draft.value, queue: [...cache.queue, { id: queueId(), kind, ...parameters }] };\n      try { persist(); } catch (_) { cache = previous; throw error('离线保存失败，请检查本机空间', 'CACHE_WRITE_FAILED'); }\n      const synced = await flush();\n      // 即使微信网络恢复，客户端也仅在收到云端回执后移出队列。\n      return result && typeof result === 'object' ? { ...result, _pendingSync: ync () => { networkAvailable = true; await ready(true); return { ...status }; }),\n    discardPending: () => run(async () => {\n      await initialize();\n      // 必须先取得有效快照；断网时不丢弃本机草稿。\n      await snapshot(); return { ...status };\n    }),\n    registerSubscription: (...args) => remote.registerSubscription(...args),\n    shared: (action, payload) => run(async () => { await initialize(); if (!networkAvailable) throw error('共同任务需要联网核对双方状态', 'CLOUD_UNAVAILABLE'); return remote.call(action, payload); }),\n    clearAll: () => run(async () => {\n      await initialize(); await remote.clearAll(); api.removeStorageSync(storageKey()); scope = null; cache = null; lastFetched = 0;\n      Object.assign(status, { verified: false, pendingCount: 0, offline: false, conflict: false, lastError: '', lastSyncedAt: '' });\n      return null;\n    })\n  };\n  return store;\n}\nmodule.exports = { createOfflineStore };\n","services/reminders.js":"'use strict';\n\nconst { calendarSlots, platformLabel, todayKey } = require('../utils/domain');\nconst { CALENDAR_KEY } = require('./store');\n\nfunction invoke(api, method, options) {\n  return new Promise((resolve, reject) => api[method](Object.assign({}, options, { success: resolve, fail: reject })));\n}\n\nfunction createReminders(api, config, store) {\n  return {\n    getStatus(task) {\n      let ledger = {};\n      try { ledger = api.getStorageSync(CALENDAR_KEY) || {}; } catch (_) { /* 无法读取时不推断已经设置。 */ }\n      const link = task && ledger[task.id];\n      const changed = !!link && (link.time !== task.time || (link.name && link.name !== task.name) || (link.type && link.type !== task.type) || (link.repeat || 'daily') !== (task.repeat || 'daily') || JSON.stringify(link.weekDays || []) !== JSON.stringify(task.weekDays || []) || (link.resumeOn || '') !== (task.resumeOn || ''));\n      const temporary = task && task.resumeOn && task.resumeOn > todayKey();\n      return {\n        wechatConfigured: !!(config.cloudEnabled && config.subscriptionTem
