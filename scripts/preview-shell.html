<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>续一下 · 体验演练 0.3.0</title>
<style id="page-style"></style>
<style>
html,body{margin:0;background:#edf0eb;color:#263c30;font-family:system-ui,"Microsoft YaHei",sans-serif;font-size:14px}
*{box-sizing:border-box}.preview-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;padding:18px}
.preview-tools button{border:1px solid #c9d2c3;background:#fff;padding:10px 16px;border-radius:8px;color:#354f3b;cursor:pointer}
.preview-tools p{margin:0;color:#5c6d5e}.phone{width:375px;max-width:100%;margin:0 auto 25px;background:#f7f6f1;border-radius:22px;border:1px solid #d9dfd3;overflow:hidden;box-shadow:0 12px 30px #263c3010}
.native-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#f6f5f2;color:#273c30;min-height:50px}.native-bar button{border:0;background:transparent;color:#315d49;font-size:14px;padding:8px;cursor:pointer}
.native-tabs{display:flex;background:#fff;border-top:1px solid #e5e8e0}.native-tabs button{flex:1;background:transparent;border:0;font-size:14px;color:#697765;padding:18px 6px;cursor:pointer}.native-tabs button[aria-current="page"]{color:#275c47;font-weight:600}
.phone-content{min-height:440px}.phone-content button{display:block;font-family:inherit;cursor:pointer}.phone-content input:not([type=checkbox]),.phone-content textarea{font-family:inherit;outline-offset:3px}.phone-content input.search-input{border:0;background:transparent}.phone-content textarea{resize:vertical}.phone-content span{vertical-align:baseline}
.preview-note{text-align:center;font-size:12px;background:#f6f5f2;color:#667561;padding:12px;line-height:1.6}.preview-picker{display:block}.preview-picker input{display:block;width:100%;min-height:38px;background:#fffefa;border:1px solid #e1e7da;color:#345039;padding:8px;border-radius:7px;margin-top:6px}
.preview-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#263c30;color:#fff;padding:12px 18px;border-radius:10px;z-index:4;max-width:90%;text-align:center}
.preview-toast:empty{display:none}dialog{padding:24px;border:1px solid #d8dfd1;border-radius:16px;max-width:340px;width:90%;color:#273c30;background:#fffefb}dialog::backdrop{background:#23302555}dialog h2{font-size:18px;margin:0 0 12px}dialog p{line-height:1.8;font-size:14px}dialog footer{display:flex;gap:10px}dialog button{flex:1;padding:12px 10px;background:#edf1e8;border:0;border-radius:8px;color:#31543d;cursor:pointer}dialog .confirm{background:#2c5946;color:#fff}
</style>
</head>
<body>
<div class="preview-tools"><strong>浏览器流程演练</strong><button id="normal-width">标准手机 375px</button><button id="small-width">紧凑手机 320px</button><p>运行真实页面逻辑；通知、日历和剪贴板为模拟接口。</p></div>
<main class="phone" id="phone"><header class="native-bar"><button id="back-button" aria-label="返回上一页">‹ 返回</button><span id="native-title">续一下</span><span>···　◉</span></header><div class="phone-content" id="page"></div><nav class="native-tabs" id="tabs" aria-label="小程序导航"></nav><div class="preview-note">交互演练 · 未连接抖音或微博<br>此预览不能验证微信通知和手机日历。</div></main>
<div class="preview-toast" id="toast" role="status" aria-live="polite"></div><dialog id="modal"><h2></h2><p></p><footer></footer></dialog>
<script>
(() => {
  const sources = /*__SOURCE_MANIFEST__*/{};
  const pageHost=document.getElementById('page'), cache={}, stack=[];
  let app, capture, renderQueued=false, toastTimer;
  const routeName=route=>route.split('?')[0].replace(/^\//,'');
  const current=()=>stack[stack.length-1];
  const api={
    getStorageSync(key){const raw=localStorage.getItem('xuyixia-ux-030:'+key);return raw?JSON.parse(raw):'';},
    setStorageSync(key,value){localStorage.setItem('xuyixia-ux-030:'+key,JSON.stringify(value));},
    removeStorageSync(key){localStorage.removeItem('xuyixia-ux-030:'+key);},
    showToast(p){document.getElementById('toast').textContent=p.title;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',2200);},
    showModal(p){const dialog=document.getElementById('modal');if(dialog.open)dialog.close();dialog.querySelector('h2').textContent=p.title||'提示';dialog.querySelector('p').textContent=p.content||'';const footer=dialog.querySelector('footer');footer.replaceChildren();let finished=false;const end=confirm=>{if(finished)return;finished=true;dialog.close();p.success?.({confirm,cancel:!confirm});};if(p.showCancel!==false){const cancel=document.createElement('button');cancel.textContent=p.cancelText||'取消';cancel.onclick=()=>end(false);footer.append(cancel);}const button=document.createElement('button');button.className='confirm';button.textContent=p.confirmText||'确定';button.onclick=()=>end(true);footer.append(button);dialog.oncancel=e=>{e.preventDefault();end(false);};dialog.showModal();},
    setClipboardData(p){api.simulatedClipboard=p.data;p.success?.({});},
    navigateTo:p=>openPage(p.url,'push'),redirectTo:p=>openPage(p.url,'replace'),
    navigateBack(){if(stack.length>1){stack.pop();render();current().definition.onShow?.call(current().definition);}else openPage('/pages/today/index','tab');},
    switchTab:p=>openPage(p.url,'tab'),setNavigationBarTitle:p=>{document.getElementById('native-title').textContent=p.title;},stopPullDownRefresh(){}
  };
  function resolve(base,request){const bits=(request.startsWith('.')?base.split('/').slice(0,-1).concat(request.split('/')):request.split('/'));const parts=[];for(const part of bits){if(part==='..')parts.pop();else if(part&&part!=='.')parts.push(part);}let key=parts.join('/');if(!key.endsWith('.js'))key+='.js';return key;}
  function load(key){if(cache[key])return cache[key].exports;if(!(key in sources))throw new Error('模块缺失 '+key);const module={exports:{}};cache[key]=module;new Function('module','exports','require','wx','App','Page','getApp','getCurrentPages',sources[key])(module,module.exports,r=>load(resolve(key,r)),api,value=>{app=value;app.onLaunch();},value=>{capture=value;},()=>app,()=>stack.map(item=>item.definition));return module.exports;}
  function queueRender(){if(renderQueued)return;renderQueued=true;queueMicrotask(()=>{renderQueued=false;render();});}
  async function openPage(url,mode){const [pathname,search='']=url.split('?'),route=routeName(pathname);const query=Object.fromEntries(new URLSearchParams(search));capture=null;delete cache[route+'.js'];load(route+'.js');const definition=capture;definition.data=JSON.parse(JSON.stringify(definition.data));const entry={route,definition};definition.setData=patch=>{Object.assign(definition.data,patch);if(current()===entry)queueRender();};if(mode==='tab')stack.length=0;else if(mode==='replace')stack.pop();stack.push(entry);render();window.scrollTo(0,0);try{await definition.onLoad?.call(definition,query);await definition.onShow?.call(definition);}catch(error){api.showToast({title:error.message});console.error(error);}queueRender();}
  function evaluate(expression,scope){try{return Function('scope','with(scope){return ('+expression+');}')(scope);}catch(error){console.error('模板表达式',expression,error);return '';}}
  function interpolate(value,scope){return value.replace(/\{\{([\s\S]*?)\}\}/g,(_,expression)=>{const result=evaluate(expression,scope);return result==null?'':String(result);});}
  function condition(el,name,scope){const value=el.getAttribute(name)||'';return Boolean(evaluate(value.replace(/^\{\{|\}\}$/g,''),scope));}
  function children(nodes,target,scope){let chain=false,matched=false;for(const node of nodes){if(node.nodeType===3){target.append(document.createTextNode(interpolate(node.textContent,scope)));continue;}if(node.nodeType!==1)continue;let show=true;if(node.hasAttribute('wx:if')){chain=true;matched=show=condition(node,'wx:if',scope);}else if(node.hasAttribute('wx:elif')){show=chain&&!matched&&condition(node,'wx:elif',scope);matched=matched||show;}else if(node.hasAttribute('wx:else')){show=chain&&!matched;matched=true;}else{chain=false;matched=false;}if(show)element(node,target,scope);}}
  function element(node,target,scope,looped=false){if(node.hasAttribute('wx:for')&&!looped){const items=evaluate(node.getAttribute('wx:for').replace(/^\{\{|\}\}$/g,''),scope)||[];items.forEach((item,index)=>element(node,target,{...scope,[node.getAttribute('wx:for-item')||'item']:item,[node.getAttribute('wx:for-index')||'index']:index},true));return;}const original=node.tagName.toLowerCase(),tag=original==='view'?'div':original==='text'?'span':original==='block'?'div':original==='picker'?'label':original==='switch'?'input':original;const el=document.createElement(tag);if(original==='block')el.style.display='contents';for(const attr of node.attributes){if(attr.name.startsWith('wx:')||/^(bind|catch)/.test(attr.name)||['value','checked','disabled'].includes(attr.name))continue;el.setAttribute(attr.name,interpolate(attr.value,scope));}if(node.hasAttribute('disabled'))el.disabled=condition(node,'disabled',scope);if(original==='input'||original==='textarea'){el.value=interpolate(node.getAttribute('value')||'',scope);el.dataset.previewField=node.getAttribute('data-field')||node.getAttribute('placeholder')||'search';}if(original==='switch'){el.type='checkbox';el.checked=condition(node,'checked',scope);}const page=current().definition;for(const attr of node.attributes){const match=/^(bind|catch)(?::)?(tap|input|change)$/.exec(attr.name);if(!match)continue;const nativeEvent=match[2]==='tap'?'click':match[2];el.addEventListener(nativeEvent,event=>{if(match[1]==='catch')event.stopPropagation();const detail={value:original==='switch'?el.checked:el.value};const handler=page[attr.value];try{Promise.resolve(handler.call(page,{currentTarget:{dataset:el.dataset},detail})).catch(error=>{console.error(error);api.showToast({title:error.message});});}catch(error){console.error(error);}});}children([...node.childNodes],el,scope);if(original==='picker'){el.classList.add('preview-picker');const input=document.createElement('input');input.type=node.getAttribute('mode')||'time';input.value=interpolate(node.getAttribute('value')||'',scope);if(node.getAttribute('end'))input.max=interpolate(node.getAttribute('end'),scope);input.setAttribute('aria-label',input.type==='date'?'选择记录日期':'选择提醒时间');input.onchange=()=>page[node.getAttribute('bindchange')].call(page,{detail:{value:input.value},currentTarget:{dataset:el.dataset}});el.append(input);}target.append(el);}
  function css(source){return source.replace(/@import[^;]+;/g,'').replace(/(-?\d*\.?\d+)rpx/g,(_,n)=>(Number(n)*.5)+'px').replace(/\bpage\s*\{/g,'.phone-content {');}
  function render(){const entry=current();if(!entry)return;const focused=document.activeElement,field=pageHost.contains(focused)?focused.dataset.previewField:null,selection=focused?.selectionStart;const template=document.createElement('template');template.innerHTML=sources[entry.route+'.wxml'].replace(/<(textarea|switch)([^>]*?)\s*\/>/g,'<$1$2></$1>');const output=document.createDocumentFragment();children([...template.content.childNodes],output,entry.definition.data);pageHost.replaceChildren(output);document.getElementById('page-style').textContent=css(sources['app.wxss']+sources['pages/shared.wxss']+sources[entry.route+'.wxss']);document.getElementById('native-title').textContent=JSON.parse(sources[entry.route+'.json']).navigationBarTitleText||'续一下';document.getElementById('back-button').hidden=stack.length<2;const tabs=document.getElementById('tabs');tabs.replaceChildren();for(const item of [{route:'pages/today/index',label:'今日'},{route:'pages/records/index',label:'记录'},{route:'pages/settings/index',label:'设置'}]){const b=document.createElement('button');b.textContent=item.label;b.setAttribute('aria-current',entry.route===item.route?'page':'false');b.onclick=()=>openPage('/'+item.route,'tab');tabs.append(b);}if(field){const restored=[...pageHost.querySelectorAll('[data-preview-field]')].find(el=>el.dataset.previewField===field);if(restored){restored.focus({preventScroll:true});try{restored.setSelectionRange(selection,selection);}catch(_){}}}}
  document.getElementById('back-button').onclick=()=>api.navigateBack();document.getElementById('normal-width').onclick=()=>document.getElementById('phone').style.width='375px';document.getElementById('small-width').onclick=()=>document.getElementById('phone').style.width='320px';
  load('app.js');
  (async()=>{const existing=await app.store.listTasks({includePaused:true});if(!existing.length&&!localStorage.getItem('xuyixia-ux-030:seeded')){await app.store.saveTask({type:'douyin',name:'小宇（示例）',time:'21:00',pinned:true,greeting:'今天也来聊两句～'});await app.store.saveTask({type:'weibo',name:'我的超话（示例）',time:'21:30'});localStorage.setItem('xuyixia-ux-030:seeded','1');}await openPage('/pages/today/index','tab');})();
})();
</script>
</body>
</html>
